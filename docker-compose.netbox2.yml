# Second NetBox instance (netbox2) for import/export testing.
# Runs alongside docker-compose.app.yml and docker-compose.netbox.yml.
# Accessible at http://42.119.165.109:8081 (host port, admin / Admin@123)
# In-network: http://netbox2-netbox:8080/api/
#
# Usage:
#   docker compose -f docker-compose.app.yml -f docker-compose.netbox.yml -f docker-compose.netbox2.yml up -d
#   # wait ~60s for first boot + migrations, then NetBox2 is at:
#   #   http://localhost:8081  (host port)
#   #   http://netbox2-netbox:8080/api/  (in-network)
#
# Admin login: admin / Admin@123
# API token: auto-generated by lab/netbox/init/02-init2.py on first boot
#             (same token as production for convenience; rotate in prod)

networks:
  netconsole:
    driver: bridge

volumes:
  netbox2_pgdata:
  netbox2_redis_data:
  netbox2_config:

services:
  netbox2-postgres:
    image: postgres:16-alpine
    container_name: netbox2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbox2
      POSTGRES_PASSWORD: netbox2
      POSTGRES_DB: netbox2
    volumes:
      - netbox2_pgdata:/var/lib/postgresql/data
    networks:
      netconsole:
        # Statically assigned IPs — .40/.41/.42 so they don't
        # collide with the app stack (.2/.3/.4/.5/.10/.11) or
        # the production NetBox stack (.20/.21/.22).
        ipv4_address: 172.31.0.40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox2 -d netbox2"]
      interval: 5s
      timeout: 5s
      retries: 10

  netbox2-redis:
    image: redis:7-alpine
    container_name: netbox2-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netbox2_redis_data:/data
    networks:
      netconsole:
        ipv4_address: 172.31.0.41
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  netbox2:
    image: netboxcommunity/netbox:v4.6.10-5.0.2
    container_name: netbox2-netbox
    restart: unless-stopped
    depends_on:
      netbox2-postgres:
        condition: service_healthy
      netbox2-redis:
        condition: service_healthy
    environment:
      DB_NAME: netbox2
      DB_USER: netbox2
      DB_PASSWORD: netbox2
      DB_HOST: netbox2-postgres
      DB_PORT: 5432
      REDIS_HOST: netbox2-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ALLOWED_HOSTS: "*"
      # Pad to 50+ chars per NetBox Django requirement.
      SECRET_KEY: "netbox2-dev-secret-CHANGE-ME-in-prod-padding-xyz1234abcd"
      # NetBox v5 uses API_TOKEN_PEPPER_1 (single string, not JSON array).
      # The configuration.py reads: _read_secret('api_token_pepper_1', environ.get('API_TOKEN_PEPPER_1', ''))
      API_TOKEN_PEPPER_1: "nb2-pepper-1"
      SUPERUSER_NAME: admin
      SUPERUSER_PASSWORD: Admin@123
      SUPERUSER_EMAIL: admin@netconsole.local
      SKIP_STARTUP_SCRIPTS: "false"
      DEBUG: "true"
    volumes:
      - netbox2_config:/etc/netbox/config:rw
      # Init script: API token + custom field + source-netbox2 tag.
      # See lab/netbox/init/02-init2.py.
      - ./lab/netbox/init:/opt/netbox/startup_scripts:ro
    networks:
      netconsole:
        ipv4_address: 172.31.0.42
    ports:
      # 8081 on the host — production NetBox uses 8080.
      # Internal NetBox HTTP server is on 8080 (DEBUG=true skips
      # supervisord reverse-proxy), so 8081:8080 maps straight through.
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

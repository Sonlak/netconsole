# NetConsole Kea DR stack — runs ONLY on the DR VPS (10.10.20.30).
#
# Topology: 1+1 hot-standby with DC primary (kea-dc1 on 10.10.20.20).
# This file is paired with docker-compose.app.yml running on the DC VPS.
# They share the same lab/kea/ image and template, but each container has
# its own KEA_PEER_* env vars pointing at the other site.
#
# Switch DHCP relay (helper-address) on the user's router must include BOTH:
#   - 10.10.20.20  (DC, served by kea-dc1)
#   - 10.10.20.30  (DR, served by kea-dr1)
# When DC is up: only DC replies. When DC dies: DR's Kea promotes and
# binds :67 (after ~15-30s heartbeat detection) and starts replying.
#
# Backend (DC side) talks to this control agent via the lab subnet at
# http://10.10.20.30:8001/ to read HA state, trigger manual switchover,
# and run the auto-failback scheduler. No Tailscale or public exposure.
#
# Deploy:
#   1. Copy this file + ./lab/kea/ to the DR VPS
#      (or rsync from DC, since lab/kea/ is identical)
#   2. cd /opt/kea-dr && docker compose -f docker-compose.kea-dr.yml up -d
#   3. Verify: curl -s http://100.105.166.18:8000/ -X POST \
#        -H 'Content-Type: application/json' \
#        -d '{"command":"ha-heartbeat","service":["dhcp4"]}'
#
# Failover sequence (DC down):
#   T+0s     DC primary dies
#   T+5-15s  DR heartbeat to DC times out
#   T+15s    DR promotes to primary, binds :67 on 10.10.20.30
#   T+15s+   Switch relay still forwards to both IPs, only DR responds
#   T+~10min (after DC container rebuild): auto-failback swaps roles
#            back to DC via ha-switch-partner, ~1-3s swap gap

networks:
  kea-dr:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.254

volumes:
  kea_dr_leases:

services:
  # kea-dr1 = DR standby (becomes primary when DC dies)
  # HA peer = kea-dc1 (DC site, Tailscale IP 100.102.133.86)
  # This server's view: peer role = "primary" (DC is normally the primary)
  kea-dr1:
    build:
      context: ./lab/kea
    container_name: netconsole-kea-dr
    hostname: kea-dr1
    restart: unless-stopped
    privileged: true
    environment:
      KEA_SERVER_NAME: kea-dr1
      KEA_PEER_NAME: kea-dc1
      # DC control agent — same lab subnet (10.10.20.0/24 shared via
      # the user's router). DC exposes 10.10.20.20:8001 (host) -> 8000
      # (container). HA heartbeat flows over this link, not Tailscale.
      KEA_PEER_URL: http://10.10.20.20:8001/
      # From this server's perspective, the DC is the primary.
      KEA_PEER_ROLE: primary
      # Same timing as DC — keep the pair in lockstep.
      KEA_HEARTBEAT_DELAY_MS: "5000"
      KEA_MAX_RESPONSE_DELAY_MS: "10000"
      KEA_MAX_ACK_DELAY_MS: "2000"
      KEA_SEED_LEASES: "false"
      # DR data plane (set to "" to disable internal vlan subinterfaces
      # when DR is a single-NIC host — adjust per actual hardware).
      KEA_DATA_MAP: ""
      KEA_HOST_OCTET: "3"
      # Empty RELAY_VIA disables the in-container routes back to the
      # client subnets. For DR failover to actually serve DHCP, the
      # reply path must reach the relay — typically handled by the
      # DR host's kernel routing table (since the relay is on the
      # 10.10.20.0/24 subnet that 10.10.20.30 belongs to).
      DHCP_RELAY_VIA: ""
    volumes:
      - kea_dr_leases:/var/lib/kea
    networks:
      kea-dr:
        ipv4_address: 172.31.0.11
    ports:
      # DR DHCP server — :67 on 10.10.20.30 (DR host's lab NIC).
      # This binding only becomes active AFTER kea-dr1 promotes to
      # primary (Kea HA behavior: standby doesn't bind :67 until then).
      # With auto-failover: true, promotion happens ~10-30s after DC
      # heartbeat times out.
      - "10.10.20.30:67:67/udp"
      # Control agent — bound on the lab NIC so backend on DC can reach
      # it via Tailscale routing to 10.10.20.30. The 8001 host port
      # avoids clashing with the backend's port 8000 (if backend also
      # runs on the DR host in some setups).
      - "10.10.20.30:8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://127.0.0.1:8000/ -H 'Content-Type: application/json' -d '{\"command\":\"version-get\",\"service\":[\"dhcp4\"]}' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 25

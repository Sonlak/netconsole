# NetBox stack for local testing — used by NetConsole to sync device inventory.
# Runs alongside docker-compose.app.yml. Shared network with the NetConsole
# app stack so the worker can reach NetBox at http://netbox:8000.
#
# Usage:
#   docker compose -f docker-compose.app.yml -f docker-compose.netbox.yml up -d
#   # wait ~60s for first boot + migrations, then NetBox is at:
#   #   http://localhost:8080  (host port, admin / Admin@123)
#   #   http://netbox-netbox:8080/api/  (in-network, used by worker)
#
# Admin login: admin / Admin@123  (set in env below)
# API token: auto-generated by lab/netbox/init/01-init.py on first boot

# The `netconsole` network MUST match the network name declared in
# docker-compose.app.yml (also `netconsole`) so that when both files are
# loaded with the same project (-p netconsole), containers land on the
# same bridge. We DO NOT mark it external here — docker-compose.app.yml
# already declares it inline (with ipam), and Compose merges the two
# definitions for the same network. Marking `external: true` here would
# force Docker to look for a literal network named `netconsole` (no
# project prefix), which doesn't exist — Compose would then error out
# the netbox up with:
#   "network netconsole declared as external, but could not be found"
# Caught on VPS during deploy #36543090105 (2026-09-29).

networks:
  netconsole:
    driver: bridge

volumes:
  netbox_pgdata:
  netbox_redis_data:
  netbox_config:

services:
  netbox-postgres:
    image: postgres:16-alpine
    container_name: netbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
      POSTGRES_DB: netbox
    volumes:
      - netbox_pgdata:/var/lib/postgresql/data
    networks:
      netconsole:
        # Reserve static IPs so they don't collide with the app stack.
        # docker-compose.app.yml uses 172.31.0.2 (postgres), .3 (backend),
        # .4 (worker), .5 (frontend), .10/.11 (kea-primary/standby).
        # NetBox stack gets .20 (postgres), .21 (redis), .22 (app).
        ipv4_address: 172.31.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  netbox-redis:
    image: redis:7-alpine
    container_name: netbox-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netbox_redis_data:/data
    networks:
      netconsole:
        ipv4_address: 172.31.0.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  netbox:
    # Tag MUST exist on Docker Hub — otherwise `docker compose
    # ... --force-recreate netbox` on every deploy silently fails
    # to pull and skips the recreate, leaving the container on
    # the stale healthcheck (and any other config drift). The
    # previously committed `v4.6.2-Docker-4.6.2` tag does NOT exist;
    # the running container is `v4.6.10-5.0.2` (carried over from
    # commit 5f09b81 upgrade(netbox) but the tag here was not).
    image: netboxcommunity/netbox:v4.6.10-5.0.2
    container_name: netbox-netbox
    restart: unless-stopped
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_healthy
    # The official image reads env vars to auto-generate /etc/netbox/config/configuration.py
    # on every boot. We override only what the auto-gen script understands
    # (DB/Redis/ALLOWED_HOSTS/SECRET_KEY/superuser), and drop our custom
    # init into /opt/netbox/startup_scripts/.
    environment:
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      DB_HOST: netbox-postgres
      DB_PORT: 5432
      REDIS_HOST: netbox-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Allow both host (via :8001) and the in-network alias
      ALLOWED_HOSTS: "*"
      # SECURITY: SECRET_KEY referenced from secrets.env. The literal
      # `netbox-dev-secret-CHANGE-ME-in-prod-...` was a known committed
      # secret. Replace by:
      #    python3 -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      # and paste into secrets.env as NETBOX_SECRET_KEY.
      SECRET_KEY: ${NETBOX_SECRET_KEY:?NETBOX_SECRET_KEY must be set in secrets.env}
      # SECURITY: SUPERUSER_PASSWORD pulled from secrets.env. Default
      # `Admin@123` is removed. To bootstrap the first admin:
      #   1. Put a strong password in secrets.env (NETBOX_SUPERUSER_PASSWORD)
      #   2. First `docker compose up` runs lab/netbox/init/01-init.py
      #      which sets the password from this env.
      SUPERUSER_NAME: admin
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD:?NETBOX_SUPERUSER_PASSWORD must be set in secrets.env}
      SUPERUSER_EMAIL: admin@netconsole.local
      SKIP_STARTUP_SCRIPTS: "false"
      # SECURITY: DEBUG off in production. The previous `true` was
      # letting stack traces leak DB schema + SECRET_KEY on any 500
      # response. With DEBUG=false, NetBox returns a generic 500 page.
      DEBUG: "false"
    volumes:
      - netbox_config:/etc/netbox/config:rw
      # Init scripts: API token + custom field. See lab/netbox/init/*.
      - ./lab/netbox/init:/opt/netbox/startup_scripts:ro
    networks:
      netconsole:
        ipv4_address: 172.31.0.22
    ports:
      # SECURITY (C9, H1, see docs/agents/16-security-audit-preprod.md):
      # Bound to the docker host's loopback only — the worker reaches
      # NetBox via the host's 127.0.0.1:8080, the same address
      # referenced in NETBOX_URL in docker-compose.app.yml. NetBox
      # is no longer reachable from the public NIC.
      #
      # PORT NOTE: 8001 is already taken by netconsole-kea-primary
      # (mapped to 10.10.20.20:8001 for the Kea control channel).
      # We use 8080 instead → 8080 on the host. NetBox's internal
      # HTTP server listens on 8080 (env DEBUG=true skips the
      # supervisord reverse-proxy), so this maps straight through.
      #
      # Note: For an emergency off-host probe (e.g. on-call SSH tunnel)
      # the operator can `ssh -L 8080:127.0.0.1:8080 ...` — the loopback
      # bind is the intended default.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # NetBox does NOT expose `/api/health/` (404), so the previous
      # endpoint silently kept the container in "(unhealthy)" state
      # for 5+ days until the gunicorn workers deadlocked and the
      # real failure cascaded. `/api/` returns 200 with the NetBox
      # version payload and is a reliable liveness probe. Interval
      # widened to 30s (was 10s) to avoid hammering the slow
      # first-query path after restart.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

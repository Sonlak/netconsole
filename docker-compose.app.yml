# NetConsole app stack for production server.
# Kea DHCPv4 HA with hot-standby on Docker custom bridge.
# DHCP relay from EVE-NG should send to private NIC 10.10.20.20:67 (not public IP).

networks:
  netconsole:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.254

volumes:
  netconsole_pgdata:
  kea_primary_leases:
  kea_standby_leases:

services:
  postgres:
    image: postgres:16-alpine
    container_name: netconsole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netconsole
      POSTGRES_PASSWORD: netconsole
      POSTGRES_DB: netconsole
    volumes:
      - netconsole_pgdata:/var/lib/postgresql/data
    networks:
      netconsole:
        ipv4_address: 172.31.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconsole -d netconsole"]
      interval: 5s
      timeout: 5s
      retries: 10

  # kea-dhcp1 = primary  → HA peer = 172.31.0.11 (kea-dhcp2)
  kea-dhcp1:
    build:
      context: ./lab/kea
    container_name: netconsole-kea-primary
    hostname: kea-primary
    restart: unless-stopped
    privileged: true
    environment:
      KEA_SERVER_NAME: kea-primary
      KEA_SEED_LEASES: "false"
      KEA_DATA_MAP: ""
      KEA_HOST_OCTET: "2"
      KEA_PRIMARY_URL: http://172.31.0.10:8000/
      KEA_STANDBY_URL: http://172.31.0.11:8000/
      DHCP_RELAY_VIA: "172.31.0.254"
    volumes:
      - kea_primary_leases:/var/lib/kea
    networks:
      netconsole:
        ipv4_address: 172.31.0.10
    ports:
      - "10.10.20.20:67:67/udp"
      - "10.10.20.20:8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://127.0.0.1:8000/ -H 'Content-Type: application/json' -d '{\"command\":\"version-get\",\"service\":[\"dhcp4\"]}' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 25

  # kea-dhcp2 = standby → HA peer = 172.31.0.10 (kea-dhcp1)
  kea-dhcp2:
    build:
      context: ./lab/kea
    container_name: netconsole-kea-standby
    hostname: kea-standby
    restart: unless-stopped
    privileged: true
    environment:
      KEA_SERVER_NAME: kea-standby
      KEA_SEED_LEASES: "false"
      KEA_DATA_MAP: ""
      KEA_HOST_OCTET: "3"
      KEA_PRIMARY_URL: http://172.31.0.10:8000/
      KEA_STANDBY_URL: http://172.31.0.11:8000/
      DHCP_RELAY_VIA: "172.31.0.254"
    volumes:
      - kea_standby_leases:/var/lib/kea
    networks:
      netconsole:
        ipv4_address: 172.31.0.11
    ports:
      - "10.10.20.20:8002:8000"
    depends_on:
      kea-dhcp1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://127.0.0.1:8000/ -H 'Content-Type: application/json' -d '{\"command\":\"version-get\",\"service\":[\"dhcp4\"]}' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 25

  backend:
    build:
      context: ./backend
    container_name: netconsole-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kea-dhcp1:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://netconsole:netconsole@172.31.0.2:5432/netconsole?schema=public
      PORT: 3000
      PING_INTERVAL_SECONDS: 120
      PING_TIMEOUT_MS: 3000
      MAC_COLLECT_INTERVAL_SECONDS: 300
      ARP_COLLECT_INTERVAL_SECONDS: 300
      INTERFACES_COLLECT_INTERVAL_SECONDS: 600
      CONFIG_COLLECT_INTERVAL_SECONDS: 900
      LOGS_COLLECT_INTERVAL_SECONDS: 0
      LOG_RETENTION_DAYS: 30
      LOG_ALERT_INTERVAL_SECONDS: 30
      SYSLOG_UDP_PORT: 1514
      LAB_SSH_ENABLED: "false"
      LAB_SSH_USER: netconsole
      LAB_SSH_PASSWORD: Admin@123
      JUNOS_NETCONF_SSH_ENABLED: "true"
      JUNOS_NETCONF_SSH_PORT: "830"
      JUNOS_REST_ENABLED: "true"
      JUNOS_REST_SCHEME: http
      JUNOS_REST_PORT: "8443"
      JUNOS_REST_VERIFY_TLS: "false"
      JUNOS_REST_USER: netconsole
      JUNOS_REST_PASSWORD: Admin@123
      # Multi-vendor APIs (added 2026-09-07). ENABLE_*_API flags gate
      # whether the vendor backend will be used for matching devices.
      # Disabled by default; flip true on a per-host basis when you've
      # provisioned a real Arista / Cisco device with matching creds.
      EOS_API_ENABLED: "true"
      EOS_API_SCHEME: http
      EOS_API_PORT: "443"
      EOS_API_VERIFY_TLS: "false"
      EOS_API_USER: netconsole
      EOS_API_PASSWORD: Admin@123
      IOSXE_API_ENABLED: "true"
      IOSXE_API_SCHEME: https
      IOSXE_API_PORT: "443"
      IOSXE_API_VERIFY_TLS: "false"
      IOSXE_API_USER: netconsole
      IOSXE_API_PASSWORD: Admin@123
      NXOS_API_ENABLED: "true"
      NXOS_API_SCHEME: http
      NXOS_API_PORT: "80"
      NXOS_API_VERIFY_TLS: "false"
      NXOS_API_USER: netconsole
      NXOS_API_PASSWORD: Admin@123
      KEA_API_URL: http://172.31.0.10:8000/
      KEA_STANDBY_API_URL: http://172.31.0.11:8000/
      KEA_TIMEOUT_MS: "5000"
      SEED_DISABLED: "false"
      CORS_ORIGINS: "http://localhost:8443,http://localhost:5173,http://42.119.165.109:8443,http://127.0.0.1:8443,https://localhost:8443,https://42.119.165.109:8443,https://127.0.0.1:8443"
      JWT_SECRET: "d97aklKZ_BKmRrHtXH6fLSZs48AlwJpAU8_RdcuCKqBm_0Jufe8Rx-FkpGhQT-cu"
    networks:
      netconsole:
        ipv4_address: 172.31.0.3
    ports:
      # API (host curl only, not exposed externally)
      - "127.0.0.1:3000:3000"
      # Syslog UDP receiver — MUST be published (not just `expose`) so that
      # the host kernel forwards incoming UDP packets from real devices on
      # the lab NIC (`10.10.20.20`) into the container. Without this,
      # Docker doesn't install a DNAT rule for UDP and the host kernel
      # silently drops the packet after the socket bind check.
      - "1514:1514/udp"

  worker:
    build:
      context: ./worker
    container_name: netconsole-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: http://172.31.0.3:3000/api
      POLL_INTERVAL_SECONDS: 1
      WORKER_NAME: netconsole-worker
      WORKER_CONCURRENCY: "8"
      WORKER_AUTH_TOKEN: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ3b3JrZXIiLCJyb2xlIjoid29ya2VyIiwidHlwZSI6IndvcmtlciIsImlhdCI6MTc4ODYyMzI3OSwiZXhwIjoxODIwMTU5Mjc5fQ.bELHMgB561GkhTyo8jGiHUQKKa22O_DhnoUoSKsmJLU"
      LAB_SSH_ENABLED: "true"
      LAB_SSH_USER: netconsole
      LAB_SSH_PASSWORD: Admin@123
      LAB_SSH_PORT: "22"
      JUNOS_NETCONF_SSH_ENABLED: "true"
      JUNOS_NETCONF_SSH_PORT: "830"
      JUNOS_REST_ENABLED: "true"
      JUNOS_REST_SCHEME: http
      JUNOS_REST_PORT: "8443"
      JUNOS_REST_VERIFY_TLS: "false"
      JUNOS_REST_USER: netconsole
      JUNOS_REST_PASSWORD: Admin@123
      # Multi-vendor APIs (added 2026-09-07). ENABLE_*_API flags gate
      # whether the vendor backend will be used for matching devices.
      # Disabled by default; flip true on a per-host basis when you've
      # provisioned a real Arista / Cisco device with matching creds.
      EOS_API_ENABLED: "true"
      EOS_API_SCHEME: https
      EOS_API_PORT: "443"
      EOS_API_VERIFY_TLS: "false"
      EOS_API_USER: netconsole
      EOS_API_PASSWORD: Admin@123
      IOSXE_API_ENABLED: "true"
      IOSXE_API_SCHEME: https
      IOSXE_API_PORT: "443"
      IOSXE_API_VERIFY_TLS: "false"
      IOSXE_API_USER: netconsole
      IOSXE_API_PASSWORD: Admin@123
      NXOS_API_ENABLED: "true"
      NXOS_API_SCHEME: http
      NXOS_API_PORT: "80"
      NXOS_API_VERIFY_TLS: "false"
      NXOS_API_USER: netconsole
      NXOS_API_PASSWORD: Admin@123
    networks:
      netconsole:
        ipv4_address: 172.31.0.4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: netconsole-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "0.0.0.0:8443:80"
    networks:
      netconsole:
        ipv4_address: 172.31.0.5

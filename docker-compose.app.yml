# NetConsole app stack for production server.
# Kea DHCPv4 HA with hot-standby on Docker custom bridge.
# DHCP relay from EVE-NG should send to private NIC 10.10.20.20:67 (not public IP).
#
# Phase 1 + 2 changes (2026-10-14):
#   * Backend now has healthcheck + stop_grace_period — docker compose
#     rolling update waits for /api/health before declaring deploy done.
#   * Worker scaled to `replicas: 2` for horizontal throughput. Two
#     workers polling /jobs/queue in parallel ~doubles the device
#     processing rate. Container name + fixed IP removed so compose can
#     create multiple replicas (auto-named `netconsole-worker-1/-2`,
#     auto-IP'd on the netconsole bridge). Worker still reaches backend
#     via backend's fixed IP 172.31.0.3.
#   * Worker drains in-flight jobs on SIGTERM (worker/netconsole_worker/
#     main.py — see DRAIN_TIMEOUT_SECS). stop_grace_period: 300s on the
#     compose service gives the worker up to 240s to finish the longest
#     Juniper RESTCONF write before docker SIGKILLs. Backend's
#     jobWatchdog reclaims stale RUNNING rows after 30s as a safety
#     net for any jobs that exceed the drain budget.
#   * Redis added for hot-read caching (/api/devices) and any future
#     pub/sub. No persistence (cache rebuilds on next request).
#   * PgBouncer deferred to Phase 2.5/3 — at the current 1 backend +
#     2 worker setup, Prisma connection count is well under PG's
#     max_connections=100. Add pgbouncer when total app clients > 50
#     (track via `SELECT count(*) FROM pg_stat_activity`).

networks:
  netconsole:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.254

volumes:
  netconsole_pgdata:
  kea_dc_leases:
  kea_dr_leases:

services:
  postgres:
    image: postgres:16-alpine
    container_name: netconsole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netconsole
      POSTGRES_PASSWORD: netconsole
      POSTGRES_DB: netconsole
    volumes:
      - netconsole_pgdata:/var/lib/postgresql/data
    networks:
      netconsole:
        ipv4_address: 172.31.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netconsole -d netconsole"]
      interval: 5s
      timeout: 5s
      retries: 10

  # kea-dc1 = DC primary → HA peer = kea-dr1 (DR site, Tailscale IP)
  # Topology: 1+1 hot-standby. DC active, DR standby. Both bind :67 (DR
  # only binds on promote). Switch relay points to both 10.10.20.20 (DC)
  # and 10.10.20.30 (DR); the alive one responds.
  #
  # Peer URL = Tailscale IP of the DR host. Kea HA heartbeat goes via
  # :8000 (control agent). Tailscale ensures reachability across the
  # public Internet without opening ports on the public NIC.
  kea-dc1:
    build:
      context: ./lab/kea
    container_name: netconsole-kea-dc
    hostname: kea-dc1
    restart: unless-stopped
    privileged: true
    environment:
      KEA_SERVER_NAME: kea-dc1
      KEA_SERVER_URL: "${KEA_SERVER_URL:-10.10.20.20}"
      KEA_SERVER_ROLE: "primary"
      # KEA_HA_ENABLED (2026-10-22): prod sets this to "false" via .env so
      # the container renders a standalone DHCP4 with NO libdhcp_ha hook.
      # Reason: the DR host does not exist yet, and prod's kea-dc1 was
      # pointed at the SAME peer (10.10.20.30) that the dev/lab VPS's
      # kea-dc1 already uses as its partner -- two "primary" servers sharing
      # one peer is an invalid hot-standby topology and the HA state machine
      # stalls. Re-enable this (together with KEA_PEER_URL) in the same
      # commit that builds the real DR server. Dev/lab leaves it unset ->
      # defaults to "true", unchanged.
      KEA_HA_ENABLED: "${KEA_HA_ENABLED:-true}"
      KEA_PEER_NAME: kea-dr1
      # DR control agent — reachable via DC's same lab subnet
      # (10.10.20.0/24 is shared between the two VPSes). Kea HA heartbeat
      # goes over :8001 (host port) on the DR's lab NIC, not :8000.
      # Unused while KEA_HA_ENABLED=false.
      KEA_PEER_URL: "${KEA_PEER_URL:-http://10.10.20.30:8001/}"
      KEA_PEER_ROLE: standby
      # Faster HA timing for failback in <30s. Trade-off: 2x heartbeat traffic.
      KEA_HEARTBEAT_DELAY_MS: "5000"
      KEA_MAX_RESPONSE_DELAY_MS: "10000"
      KEA_MAX_ACK_DELAY_MS: "2000"
      KEA_SEED_LEASES: "false"
      KEA_DATA_MAP: ""
      KEA_HOST_OCTET: "2"
      DHCP_RELAY_VIA: "172.31.0.254"
    volumes:
      - kea_dc_leases:/var/lib/kea
    networks:
      netconsole:
        ipv4_address: 172.31.0.10
    ports:
      # DC DHCP server — :67 on 10.10.20.20 (DC host's lab NIC).
      # Switch DHCP helper-address includes this IP.
      - "${KEA_HOST_IP:-10.10.20.20}:67:67/udp"
      # Control agent for backend/dashboard/monitoring. Bound on the
      # private NIC so the backend (172.31.0.3) and DR kea (via Tailscale)
      # can both reach it without exposing on the public IP.
      - "${KEA_HOST_IP:-10.10.20.20}:8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://127.0.0.1:8000/ -H 'Content-Type: application/json' -d '{\"command\":\"version-get\",\"service\":[\"dhcp4\"]}' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 25

  # NOTE: kea-dr1 is NOT deployed on the DC host. It runs on the DR VPS
  # (10.10.20.30) via docker-compose.kea-dr.yml. The DC kea-dc1 reaches
  # it via the shared lab subnet using KEA_PEER_URL above. Lease
  # replication happens over the same link via libdhcp_ha.so.
  #
  # If you need to run both kea-dc1 and kea-dr1 on the same host for
  # local testing, use docker-compose.lab.yml (single-host variant) and
  # override the peer URLs to the local Docker bridge IPs.

  # Redis cache layer (Phase 2 — 2026-10-14).
  # Used for:
  #   * hot-read cache on /api/devices (read-through, 30s TTL)
  #   * future pub/sub or rate-limit buckets
  # No persistence — cache rebuilds from PG on next request after
  # restart. If we later want cache to survive Redis restarts, switch
  # to AOF via `--appendonly yes`.
  redis:
    # IP CHANGED 2026-10-14 22:30 (fix IP conflict with netbox-redis)
    # Original .21 collided with docker-compose.netbox.yml's netbox-redis
    # service at the same IP — caused "failed to set up container networking:
    # Address already in use" on every deploy since commit 3adfd01.
    # .23 was free (allocted: .2 postgres, .3 backend, .5 frontend,
    # .10/.11 kea, .20 netbox-postgres, .21 netbox-redis, .22 netbox).
    image: redis:7-alpine
    container_name: netconsole-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    networks:
      netconsole:
        ipv4_address: 172.31.0.23
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        NETCONSOLE_VERSION: "${NETCONSOLE_VERSION:-unknown}"
        NETCONSOLE_GIT_COMMIT: "${NETCONSOLE_GIT_COMMIT:-unknown}"
    container_name: netconsole-backend
    restart: unless-stopped
    # SECURITY (C7, see docs/agents/16-security-audit-preprod.md):
    # JWT_SECRET / CORS_ORIGINS are referenced from `secrets.env`
    # (which is gitignored and lives on the VPS at
    # `/opt/netconsole/secrets.env`). The .env-file ${VAR:?...} syntax
    # makes docker compose refuse to start if a required variable is
    # missing — there is no more silent fallback to a guessable
    # default. Production secrets are NEVER inside the committed
    # compose file.
    env_file:
      - path: ${SECRETS_ENV:-./secrets.env}
        required: false
    # Phase 1: graceful shutdown window. SIGTERM handler in
    # backend/src/index.ts sets isShuttingDown=true (returns 503 from
    # /api/health so any future LB drains), closes HTTP server, stops
    # syslog receiver, then disconnects Prisma. 30s is the worst-case
    # bound for active HTTP requests + Prisma disconnect. Docker
    # SIGKILLs after this grace period.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kea-dc1:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://netconsole:netconsole@172.31.0.2:5432/netconsole?schema=public
      # REDIS_URL — used by backend/src/lib/redis.ts. Hit it via the
      # fixed IP rather than `redis:6379` to avoid a Docker DNS lookup
      # on every cache call. 172.31.0.23 is the redis service's
      # static IP assigned in the redis: block above.
      # CHANGED 2026-10-14 22:30 (was .21, conflict with netbox-redis).
      REDIS_URL: redis://172.31.0.23:6379/0
      PORT: 3000
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # The Prisma CLI phones home for a version check on every start.
      # The production VPS has no direct internet egress, so the call can
      # stall the container start. Disable it — the version is pinned by
      # the lockfile anyway.
      CHECKPOINT_DISABLE: "1"
      PING_INTERVAL_SECONDS: 60
      PING_TIMEOUT_MS: 3000
      # Managed check every 3 min (was 10 min). The previous 600s value
      # was fine when the probe did heavy SSH + RESTCONF fetches, but the
      # TCP-only probe (worker/netconsole_worker/probe.py) is now ~2-5s
      # per device. 3 min keeps the REST/NETCONF flag fresh without
      # burning auth.log. Offline→online recovery is now also covered
      # by an immediate MANAGED_CHECK trigger in devicePing.ts (no need
      # to wait for this scheduler tick).
      MANAGED_CHECK_INTERVAL_SECONDS: 180
      MAC_COLLECT_INTERVAL_SECONDS: 300
      ARP_COLLECT_INTERVAL_SECONDS: 300
      INTERFACES_COLLECT_INTERVAL_SECONDS: 600
      CONFIG_COLLECT_INTERVAL_SECONDS: 900
      LOGS_COLLECT_INTERVAL_SECONDS: 0
      LOG_RETENTION_DAYS: 30
      JOB_RETENTION_DAYS: 30
      LOG_ALERT_INTERVAL_SECONDS: 30
      SYSLOG_UDP_PORT: 1514
      # SECURITY (M1, see docs/agents/16-security-audit-preprod.md):
      # vendor credentials (LAB_SSH_*, JUNOS_REST_PASSWORD,
      # IOSXE_API_PASSWORD, EOS_API_PASSWORD, NXOS_API_PASSWORD) all
      # reference secrets.env via ${VAR:?msg}. The committed literal
      # `Admin@123` is gone — a fresh deploy won't work without the
      # operator-provided secrets file. Lab dev: copy `secrets.env.dev`
      # from your private notes (NOT committed).
      SYSLOG_ALLOWED_CIDRS: "10.10.20.0/24,127.0.0.0/8"
      SYSLOG_BIND_ADDRESS: "0.0.0.0"
      LAB_SSH_ENABLED: "true"
      LAB_SSH_USER: ${LAB_SSH_USER:?LAB_SSH_USER must be set}
      LAB_SSH_PASSWORD: ${LAB_SSH_PASSWORD:?LAB_SSH_PASSWORD must be set}
      JUNOS_NETCONF_SSH_ENABLED: "true"
      JUNOS_NETCONF_SSH_PORT: "830"
      JUNOS_REST_ENABLED: "true"
      JUNOS_REST_SCHEME: http
      JUNOS_REST_PORT: "8443"
      JUNOS_REST_VERIFY_TLS: "false"
      JUNOS_REST_USER: ${JUNOS_REST_USER:?JUNOS_REST_USER must be set}
      JUNOS_REST_PASSWORD: ${JUNOS_REST_PASSWORD:?JUNOS_REST_PASSWORD must be set}
      IOSXE_API_ENABLED: "true"
      IOSXE_API_SCHEME: https
      IOSXE_API_PORT: "443"
      IOSXE_API_VERIFY_TLS: "false"
      IOSXE_API_USER: ${IOSXE_API_USER:?IOSXE_API_USER must be set}
      IOSXE_API_PASSWORD: ${IOSXE_API_PASSWORD:?IOSXE_API_PASSWORD must be set}
      EOS_API_ENABLED: "true"
      EOS_API_SCHEME: https
      EOS_API_PORT: "443"
      EOS_API_VERIFY_TLS: "false"
      EOS_API_USER: ${EOS_API_USER:?EOS_API_USER must be set}
      EOS_API_PASSWORD: ${EOS_API_PASSWORD:?EOS_API_PASSWORD must be set}
      NXOS_API_ENABLED: "true"
      NXOS_API_SCHEME: http
      NXOS_API_PORT: "80"
      NXOS_API_VERIFY_TLS: "false"
      NXOS_API_USER: ${NXOS_API_USER:?NXOS_API_USER must be set}
      NXOS_API_PASSWORD: ${NXOS_API_PASSWORD:?NXOS_API_PASSWORD must be set}
      KEA_API_URL: http://172.31.0.10:8000/
      # DR control agent — same lab subnet as DC (10.10.20.0/24 shared
      # between the two VPSes via router/site-to-site). Container exposes
      # 10.10.20.30:8001 (host) -> 8000 (container). Backend (172.31.0.3)
      # reaches it through the host's routing table.
      #
      # Overridable via .env: on a deployment with NO DR site (prod), set
      # KEA_HA_ENABLED=false — the backend then stops probing this URL
      # entirely instead of talking to an unrelated Kea instance.
      # NOTE: `${VAR-default}` (no colon) on purpose — an explicitly EMPTY
      # value in .env must stay empty. `${VAR:-default}` would silently
      # substitute the dev URL back in.
      KEA_STANDBY_API_URL: ${KEA_STANDBY_API_URL-http://10.10.20.30:8001/}
      KEA_TIMEOUT_MS: "5000"
      # Mirrors the flag the kea-dc1 container uses to decide whether to
      # load the libdhcp_ha hook. The backend MUST agree with the Kea
      # server: a standalone Kea answers `ha-heartbeat` with result=3
      # ("unsupported command"), which used to be read as "DC down" and
      # handed the active site to a DR peer that was never configured.
      KEA_HA_ENABLED: ${KEA_HA_ENABLED:-true}
      # Auto-failback: when DC recovers after a failover, scheduler
      # will call ha-switch-partner to swap primary back to DC.
      # Disabled by default until the DR pair is deployed in production.
      KEA_AUTO_FAILBACK: "true"
      KEA_FAILBACK_STABILITY_SECONDS: "300"
      KEA_FAILBACK_COOLDOWN_SECONDS: "3600"
      KEA_FAILBACK_CHECK_INTERVAL_SECONDS: "30"
      # NetBox sync — set NETBOX_SYNC_INTERVAL_SECONDS > 0 to enable
      # the periodic sync. The worker reads NETBOX_URL / NETBOX_TOKEN
      # to know where to push. Both should be set; if either is empty
      # the enqueued sync jobs will fail with a clear error in the job row.
      # Disabled by default so a fresh deploy does not hammer an absent
      # NetBox instance. Set to e.g. 300 for a 5-minute cycle.
      NETBOX_SYNC_INTERVAL_SECONDS: "300"
      # NetBox is a CONTAINER on the same `netconsole` bridge as backend,
      # so they talk directly over the bridge at its static IP 172.31.0.22
      # (declared in docker-compose.netbox.yml).
      #
      # CHANGED 2026-10-22: was `http://127.0.0.1:8080/api/`. Inside a
      # container, 127.0.0.1 is that CONTAINER's own loopback, NOT the
      # docker host - the host-published 127.0.0.1:8080 is unreachable
      # from backend/worker. Every sync therefore failed silently (backend
      # logged "bulk sync applied: updated=0 failed=0" on every cycle, and
      # with 0 devices imported the failure never surfaced in the UI).
      # Port 8080 inside the netbox container; 8001 is taken by kea's
      # control channel on the host.
      # NetBox sync — SECURITY (C10, see docs/agents/16-security-audit-preprod.md):
      # tokens are now in `secrets.env`, not in this file. Reference via
      # `${VAR:?msg}` — docker compose refuses to start if the secret is
      # missing. Production tokens rotate by editing secrets.env +
      # restarting backend/worker; no commit needed.
      NETBOX_URL: "http://172.31.0.22:8080/api/"
      NETBOX_TOKEN: ${NETBOX_TOKEN:?NETBOX_TOKEN must be set in secrets.env}
      # Multi-instance NetBox JSON — derived from individual tokens so
      # we don't need to keep a duplicate set elsewhere.
      # NOTE: This MUST be a YAML double-quoted string with \" escapes —
      # a YAML single-quoted string cannot contain unescaped single quotes
      # (the inner `"` delimiters from the JSON would also break single-
      # quoted YAML). Docker compose still substitutes ${NETBOX_TOKEN:?}
      # at parse time, so the missing-secret fail-fast still works.
      NETBOX_INSTANCES: "{\"production\":{\"url\":\"http://172.31.0.22:8080/api/\",\"token\":\"${NETBOX_TOKEN:?}\"},\"netbox2\":{\"url\":\"http://172.31.0.42:8080/api/\",\"token\":\"${NETBOX_TOKEN_NETBOX2:?}\"}}"
      NETBOX_DEFAULT_INSTANCE: "production"
      SEED_DISABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in secrets.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in secrets.env}
      # AI Assistant (OpenAI). Set OPENAI_API_KEY in the GitHub Actions
      # deploy.yml environment block (or in /opt/netconsole/backend/.env
      # on the VPS) before this will return anything other than 503.
      # Get a key at https://platform.openai.com/api-keys.
      # gpt-4o-mini is the production default since 2026-10-13
      # (revert from gpt-4.1 per user request — "như ban đầu").
      # gpt-4.1 (full) was tried 2026-10-13 to fix tool routing but
      # reverted the same day at user request.
      # gpt-4.1-mini was unreliable for tool routing with 55+ tools
      # (would call list_dhcp_leases for ARP queries, queue_collect
      # for "tổng hợp MAC"); gpt-4o-mini handles this slightly better
      # than gpt-4.1-mini and costs less.
      # For local dev, override OPENAI_MODEL=gpt-4.1-mini in .env.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      # AI Assistant — HTTP proxy (2026-10-29).
      #
      # The PRODUCTION VPS has NO direct internet egress: every outbound
      # connection must go through the site HTTP proxy. Node's built-in
      # `fetch` (undici) does NOT read HTTPS_PROXY by default, so the
      # OpenAI SDK timed out against api.openai.com and the assistant
      # never produced a token. `llmClient.ts` reads OPENAI_PROXY_URL
      # (falling back to HTTPS_PROXY/HTTP_PROXY) and installs an
      # undici ProxyAgent dispatcher on the OpenAI client.
      #
      # NOTE: `${VAR-default}` (no colon) on purpose — an explicitly EMPTY
      # value in .env must stay empty so a host WITHOUT a proxy keeps the
      # direct connection path.
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL-}
    networks:
      netconsole:
        ipv4_address: 172.31.0.3
    ports:
      # API (host curl only, not exposed externally)
      - "127.0.0.1:3000:3000"
      # Syslog UDP receiver — MUST be published (not just `expose`) so that
      # the host kernel forwards incoming UDP packets from real devices on
      # the lab NIC (`10.10.20.20`) into the container. Without this,
      # Docker doesn't install a DNAT rule for UDP and the host kernel
      # silently drops the packet after the socket bind check.
      #
      # SECURITY (H3, see docs/agents/16-security-audit-preprod.md):
      # Bound to the lab NIC only — the backend also enforces an
      # in-process `SYSLOG_ALLOWED_CIDRS` allowlist (default
      # `10.10.20.0/24,127.0.0.0/8`). Anything from the public NIC
      # is dropped at the iptables level (see deploy.yml's "Open
      # iptables" step).
      - "${KEA_HOST_IP:-10.10.20.20}:1514:1514/udp"
    # Resource cap (added 2026-09-18). Backend holds long-lived SSH
    # sockets for every interactive terminal session (one per WS
    # connection) — without a cap, a runaway admin or memory leak can
    # starve Postgres / Kea / worker on the same VPS. cpus=1.5 still
    # leaves headroom for collect jobs; 1g memory is ~5× the measured
    # peak (229MiB during ARP collect). Tuned via deploy.yml restart
    # if real workload pushes past these limits.
    mem_limit: 1g
    mem_reservation: 512m
    cpus: '1.5'
    # Phase 1: backend healthcheck. Used by docker compose rolling
    # update (`update_config.order: start-first`) and by the deploy
    # workflow's "Wait for backend healthy" probe. Returns 503 while
    # shutting down (see gracefulShutdown → /api/health branch in
    # backend/src/index.ts), so any future load balancer in front
    # would drain this instance during a deploy.
    #
    # CHANGED 2026-10-14 22:50 (deploy hardening).
    # The previous `curl -sf http://...` probe failed with
    # '/bin/sh: 1: curl: not found' because the backend image
    # (node:22-bookworm-slim) only installs iputils-ping, openssl,
    # ca-certificates, postgresql-client — no curl. FailedStreak went
    # to 23, backend was marked 'unhealthy' by Docker, and the worker
    # depends_on: backend: service_healthy never resolved — workers
    # stayed in 'Created' state forever. Replaced curl with a
    # Node one-liner so the probe uses the same runtime that's
    # already in the image (no Dockerfile change needed).
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 5s
      timeout: 3s
      retries: 10
      # First-boot can include `prisma db push` (~30s on cold start
      # with --accept-data-loss), then Node startup, then API bind.
      # 30s start_period tolerates that without flapping.
      start_period: 30s

  worker:
    build:
      context: ./worker
    # Phase 2: container_name + ipv4_address REMOVED so `replicas: 2`
    # works (compose auto-names to netconsole-worker-1 / -2 and
    # auto-IPs each on the netconsole bridge). The previous single
    # `netconsole-worker` container is removed by deploy.yml's
    # `rm -sf worker` step on the next deploy. Worker still reaches
    # backend via backend's fixed IP 172.31.0.3 — that hasn't changed.
    restart: unless-stopped
    # Phase 1: drain window for in-flight jobs. SIGTERM handler in
    # worker/netconsole_worker/main.py drains up to DRAIN_TIMEOUT_SECS
    # (180s, matches Juniper RESTCONF write worst case from gotcha
    # #15a). 300s grace period gives Docker enough time to wait for
    # the longest legitimate write to finish before SIGKILL.
    stop_grace_period: 300s
    depends_on:
      backend:
        condition: service_healthy
    # Phase 2: horizontal worker scaling. `replicas: 2` (instead of 1)
    # gives us 2× the device-processing throughput without any code
    # changes — both replicas poll /jobs/queue and the queue's
    # SELECT ... FOR UPDATE SKIP LOCKED (Phase 2 in jobs.ts) prevents
    # duplicate claim. Scale up by editing this number and re-running
    # deploy. Note: Prisma's device-lock check (busy device skip)
    # also works across replicas — only one worker can hold a
    # RUNNING job for a given device at a time.
    deploy:
      replicas: 2
    environment:
      API_BASE_URL: http://172.31.0.3:3000/api
      POLL_INTERVAL_SECONDS: 1
      WORKER_NAME: netconsole-worker
      WORKER_CONCURRENCY: "8"
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:?WORKER_AUTH_TOKEN must be set in secrets.env}
      LAB_SSH_ENABLED: "true"
      LAB_SSH_USER: ${LAB_SSH_USER:?LAB_SSH_USER must be set}
      LAB_SSH_PASSWORD: ${LAB_SSH_PASSWORD:?LAB_SSH_PASSWORD must be set}
      LAB_SSH_PORT: "22"
      JUNOS_NETCONF_SSH_ENABLED: "true"
      JUNOS_NETCONF_SSH_PORT: "830"
      JUNOS_REST_ENABLED: "true"
      JUNOS_REST_SCHEME: http
      JUNOS_REST_PORT: "8443"
      JUNOS_REST_VERIFY_TLS: "false"
      JUNOS_REST_USER: ${JUNOS_REST_USER:?JUNOS_REST_USER must be set}
      JUNOS_REST_PASSWORD: ${JUNOS_REST_PASSWORD:?JUNOS_REST_PASSWORD must be set}
      EOS_API_ENABLED: "true"
      EOS_API_SCHEME: https
      EOS_API_PORT: "443"
      EOS_API_VERIFY_TLS: "false"
      EOS_API_USER: ${EOS_API_USER:?EOS_API_USER must be set}
      EOS_API_PASSWORD: ${EOS_API_PASSWORD:?EOS_API_PASSWORD must be set}
      IOSXE_API_ENABLED: "true"
      IOSXE_API_SCHEME: https
      IOSXE_API_PORT: "443"
      IOSXE_API_VERIFY_TLS: "false"
      IOSXE_API_USER: ${IOSXE_API_USER:?IOSXE_API_USER must be set}
      IOSXE_API_PASSWORD: ${IOSXE_API_PASSWORD:?IOSXE_API_PASSWORD must be set}
      NXOS_API_ENABLED: "true"
      NXOS_API_SCHEME: http
      NXOS_API_PORT: "80"
      NXOS_API_VERIFY_TLS: "false"
      NXOS_API_USER: ${NXOS_API_USER:?NXOS_API_USER must be set}
      NXOS_API_PASSWORD: ${NXOS_API_PASSWORD:?NXOS_API_PASSWORD must be set}
      IOS_HTTP_ENABLED: "true"
      IOS_HTTP_PORT: "443"
      IOS_HTTP_USER: netconsole
      IOS_HTTP_PASSWORD: ${IOS_HTTP_PASSWORD:?IOS_HTTP_PASSWORD must be set}
      # NetBox sync — must match the value on the backend so the worker
      # talks to the same NetBox instance. The literal is the dev token
      # created by lab/netbox/init/01-init.py — rotate for prod via
      # `docker exec netbox-netbox python manage.py drf_create_token admin`.
      # Use the VPS public IP so the worker can reach NetBox through the
      # host port mapping (8080 → 8080 inside the netbox container).
      # Port 8080 chosen because 8001 is occupied by kea-primary.
      # SECURITY (C10): NETBOX_TOKEN pulled from secrets.env. The
      # worker reaches NetBox over the docker bridge at its static IP
      # 172.31.0.22 - NOT 127.0.0.1, which inside a container is the
      # container's own loopback (same fix as the backend block above).
      NETBOX_URL: "http://172.31.0.22:8080/api/"
      NETBOX_TOKEN: ${NETBOX_TOKEN:?NETBOX_TOKEN must be set in secrets.env}
      # Multi-instance NetBox JSON — derived from secrets.env.
      # See backend block above for the YAML-quoting rules: this MUST
      # be a double-quoted string with \" escapes, otherwise the inner
      # single quotes from the JSON delimiters break YAML parsing
      # (single-quoted YAML strings cannot contain unescaped ').
      NETBOX_INSTANCES: "{\"production\":{\"url\":\"http://172.31.0.22:8080/api/\",\"token\":\"${NETBOX_TOKEN:?}\"},\"netbox2\":{\"url\":\"http://172.31.0.42:8080/api/\",\"token\":\"${NETBOX_TOKEN_NETBOX2:?}\"}}"
      NETBOX_DEFAULT_INSTANCE: "production"
      # Management prefix for IPAM sync. Creates /24 prefix in NetBox IPAM
      # and populates primary_ip4 on each device. Change to match your lab subnet.
      # Leave empty to skip IPAM (management IPs stored in device description only).
      NETBOX_MANAGEMENT_PREFIX: "10.10.20.0/24"
    # Phase 2: removed `ipv4_address` to support `replicas: 2`.
    # Compose auto-assigns IPs from the 172.31.0.0/24 subnet for
    # each replica. Worker → backend traffic still uses the fixed
    # IP 172.31.0.3 (backend service has its own ipv4_address).
    networks:
      - netconsole

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: netconsole-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      # SECURITY (C11, see docs/agents/16-security-audit-preprod.md):
      # Frontend serves HTTPS on 443 inside the container (nginx
      # listens on 443 with the cert from /etc/nginx/certs/). The
      # host publish is 0.0.0.0:8443 → 443. Once a real CA-signed
      # cert replaces the self-signed one (via the volume mount
      # below), the browser warning goes away. Until then, this is
      # still TLS-encrypted — just MITM-vulnerable by cert trust.
      - "0.0.0.0:8443:443"
    # TLS cert material. The image ships with a self-signed cert
    # (built into /etc/nginx/certs/ by Dockerfile.prod) so it boots
    # out of the box. NO `volumes:` block is set here by default —
    # the image's self-signed cert is used. To swap in a real cert
    # in production, uncomment one of the two blocks below and
    # `docker compose restart frontend` (no rebuild).
    #
    # Production (VPS, Let's Encrypt):
    #   1. Run `scripts/install_lets_encrypt.sh <domain>` once
    #      — populates /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem
    #   2. Replace the empty volumes list below with:
    #        volumes:
    #          - /etc/letsencrypt:/etc/letsencrypt:ro
    #   3. `docker compose -f docker-compose.app.yml restart frontend`
    #
    # Local dev (Windows / macOS dev machine):
    #   1. Run `bash frontend/certs/generate_self_signed.sh` (or
    #      `.ps1`) once — file lands in frontend/certs/{cert,key}.pem
    #   2. Replace the empty volumes list below with:
    #        volumes:
    #          - ./frontend/certs:/etc/nginx/certs:ro
    #   3. Browse https://localhost:8443, accept the cert warning.
    #      The same cert is also used for the WebSocket wss:// so
    #      terminal sessions work end-to-end.
    #
    # Why no default `volumes:` block? An empty list (`volumes: []`)
    # makes `docker compose config` error with "must be a array"
    # because Docker Compose refuses an explicit empty list (only a
    # missing key is OK). Commenting out the block keeps the
    # no-mount path working AND documents how to enable a real
    # mount without breaking the file.
    # volumes: []  # keep commented — uncomment the lines above when needed
    networks:
      netconsole:
        ipv4_address: 172.31.0.5

# Production overlay for docker-compose.app.yml.
#
# This file is loaded with `-f docker-compose.app.yml -f docker-compose.app.prod.yml`.
# It OVERRIDES the `build:` directives from the base file with pre-built
# GHCR images, so the deploy step becomes `docker compose pull && up -d`
# instead of `up -d --build`.
#
# Why this exists:
#   - On the deploy runner, the network egress for the GitHub Container
#     Registry is fine, but rebuilding three ~1-2GB images from local
#     Dockerfiles is slow (5-7 min) because the runner is a thin VPS
#     and Docker layer cache misses after any Dockerfile change.
#   - GitHub Actions runners, in contrast, have warm BuildKit cache
#     (`cache-from: type=gha` in the push-images job) so the CI build
#     is consistently 1-2 min even on cold cache.
#   - Splitting build (CI) from deploy (VPS) lets us:
#       * build in parallel with deploy
#       * keep deploy atomic: pull → stop → recreate → up. No
#         possibility of a half-built image sitting on the VPS.
#
# The kea-dhcp* services WERE originally not overridden here because they
# were "built once, locally, on first deploy". That assumption only holds
# on a host with direct internet access. The production VPS has no direct
# egress at all (every outbound connection must go through the site HTTP
# proxy), and Docker does not inject the client's proxy environment into
# `docker build`, so `apt-get update` inside the kea build found no
# package index and the build died with:
#     E: Unable to locate package kea-dhcp4-server
#     E: Package 'ca-certificates' has no installation candidate
# while backend/worker/frontend built fine (they are built by the CI
# job on a GitHub-hosted runner, which does have direct egress).
#
# kea-dc1 is therefore built by the same push-images CI job and pulled
# from GHCR here, exactly like the other three services. Local dev still
# uses docker-compose.app.yml alone (with `build:`), so the dev VPS keeps
# building kea locally as before.
#
# Image tag: pinned to the running commit SHA. The deploy runs
# SEQUENTIALLY after push-images (`needs: push-images` in the
# workflow), so the SHA tag is guaranteed to exist by the time
# the pull runs. This eliminates the race condition where a
# parallel deploy could pull the previous :main image before the
# new push completes. See deploy.yml for the full analysis.
services:
  backend:
    image: ghcr.io/sonlak/netconsole-backend:${GITHUB_SHA:-main}
    pull_policy: always

  worker:
    image: ghcr.io/sonlak/netconsole-worker:${GITHUB_SHA:-main}
    pull_policy: always

  frontend:
    image: ghcr.io/sonlak/netconsole-frontend:${GITHUB_SHA:-main}
    pull_policy: always

  kea-dc1:
    image: ghcr.io/sonlak/netconsole-kea:${GITHUB_SHA:-main}
    pull_policy: always
    # Subnet list (2026-10-28): the kea image ships the LAB subnet list
    # (10.1.201.0/24 ... 10.1.204.0/24) as its default because that is the
    # dev/lab topology. Production has NOT onboarded any real bank subnet
    # yet, so prod mounts an EMPTY list — otherwise the prod dashboard
    # showed the lab pools and prod Kea would answer for lab subnets.
    #
    # The file is synced to /opt/netconsole/lab/kea/subnets.prod.json by
    # the rsync step in deploy-prod.yml (lab/kea is not excluded).
    volumes:
      # Only the subnet file is mounted here; the base compose file
      # already declares the `kea_dc_leases` volume for /var/lib/kea and
      # docker compose merges the two `volumes` lists by target path.
      - ./lab/kea/subnets.prod.json:/etc/kea/subnets.json:ro
    environment:
      KEA_SUBNETS_FILE: /etc/kea/subnets.json

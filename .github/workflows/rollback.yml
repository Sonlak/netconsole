# =============================================================================
# NetConsole Auto-Rollback — isolated from bad deploy commits
#
# HOW IT WORKS (critical design):
#   This workflow is triggered by `workflow_run` when deploy.yml fails.
#   A `workflow_run` trigger ALWAYS runs this workflow file from the DEFAULT
#   BRANCH (main), NOT from the commit that triggered the failure.
#   This means a bad commit that modifies deploy.yml CANNOT break rollback.
#
# TRIGGER CHAIN:
#   Bad push → deploy.yml (fails) → triggers rollback.yml (from main branch)
#   → resolves good commit → rebuilds → service restored
#
# MARKER RESOLUTION (priority order, LOCAL ops — runner IS the VPS):
#   The self-hosted runner runs on the VPS itself. Deploy steps already use
#   `cat $DEPLOY_DIR/.last-deploy-sha` directly. The rollback follows the
#   same pattern — no SSH, no vars, no external dependencies.
#   1. .rollback-before-deploy-sha — anchor set by the PREVIOUS successful deploy
#   2. .last-deploy-sha            — current VPS state
#   3. git HEAD on /opt/netconsole  — fresh VPS, no marker yet
#   4. FALLBACK_SHA (hardcoded)    — last resort when markers are corrupt
#
# SCHEMA DRIFT SAFETY (fixed 2026-09-15):
#   The backend container now uses scripts/docker-start.sh, which runs
#   `prisma db push --accept-data-loss` and proceeds to start the backend
#   regardless of its exit code. This means rollback ALWAYS brings the
#   service up — even when the rolled-back schema.prisma differs from the
#   DB's current schema. Field-level API errors may occur until the next
#   correct deploy, but the service is live and healthchecks pass.
#
# HISTORY (root cause of 5 consecutive silent fails on this step before 2026-09-16):
#   Earlier revisions SSH'd from the runner to itself (vars.VPS_HOST) to read
#   marker files. This fails when vars are unset OR when self-SSH lacks key
#   auth — both happen in practice. Fix: read markers LOCALLY, same as
#   deploy.yml does.
# =============================================================================
name: Rollback

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  # Allow manual rollback from GitHub Actions UI.
  # Useful when ops needs to roll back to an arbitrary known-good ref.
  workflow_dispatch:
    inputs:
      ref:
        description: "Known-good git ref (branch / tag / sha) to roll back to"
        required: false
        default: ""
      clear_markers:
        description: "Wipe .rollback-before-deploy-* on the VPS before running (used when markers are stale/corrupt)"
        required: false
        default: "false"

# Prevent concurrent deploy+rollback on the same VPS.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  COMPOSE_PROJECT: netconsole
  DEPLOY_SERVICES: "backend worker frontend"
  # Last-resort fallback when ALL marker logic fails.
  # Update this when a new "known-good" is confirmed in production.
  # Currently: 2026-09-16 08:20 "fix(rollback): use local file ops + FALLBACK_SHA"
  # Verified working: Rollback #19 (commit 563f8a9 failed, rollback to 2341643 succeeded in 1m53s).
  FALLBACK_SHA: 2341643b4e07b2f5d71282d07c421faf91b305a8
  FALLBACK_REF: main

jobs:
  rollback:
    name: Auto-rollback to last known-good
    runs-on: self-hosted
    # Run when:
    #   - workflow_run trigger AND Deploy failed (auto path)
    #   - OR workflow_dispatch (manual path — no workflow_run context exists)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    timeout-minutes: 20

    steps:
      - name: Set up job
        run: |
          echo "## ⏪ Auto-rollback triggered by failed Deploy run"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏪ **Auto-rollback triggered**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Triggering run: [${{ github.event.workflow_run.name }} #${GITHUB_EVENT_WORKFLOW_RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})" >> $GITHUB_STEP_SUMMARY
            echo "Triggering commit: \`${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Trigger: manual workflow_dispatch" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow file SHA:** \`${{ github.sha }}\` (rollback.yml is always read from main, never from failing commit)" >> $GITHUB_STEP_SUMMARY

      - name: Display rollback target info
        run: |
          echo "==> Rollback target: $DEPLOY_DIR"
          echo "==> This workflow file is from: ${{ github.ref }} (${{ github.sha }})"
          echo "==> Runner hostname: $(hostname)"
          echo "==> Working dir: $(pwd)"

      # ── Resolve the good commit to roll back to ────────────────────────────────
      #
      # Pure local file ops. No SSH, no vars, no external dependencies.
      # The runner is the VPS — deploy.yml already proves direct file access works.
      - name: Read last known-good marker from VPS
        id: marker
        env:
          ROLLBACK_REF: ${{ inputs.ref }}
          CLEAR_MARKERS: ${{ inputs.clear_markers }}
        run: |
          set -uo pipefail

          echo "==> Marker resolution context"
          echo "  DEPLOY_DIR          = ${DEPLOY_DIR:-<empty>}"
          echo "  Runner              = $(hostname)"
          echo "  ROLLBACK_REF input  = '${ROLLBACK_REF:-<empty>}'"
          echo "  CLEAR_MARKERS input = '${CLEAR_MARKERS:-<empty>}'"
          echo "  FALLBACK_SHA        = ${FALLBACK_SHA:-<empty>}"
          echo "  /opt/netconsole exists: $([ -d "$DEPLOY_DIR" ] && echo yes || echo no)"

          # Clear markers if requested (workflow_dispatch input)
          if [ "${CLEAR_MARKERS:-}" = "true" ]; then
            echo "==> Clearing local rollback markers as requested"
            rm -f "$DEPLOY_DIR/.rollback-before-deploy-sha" \
                  "$DEPLOY_DIR/.rollback-before-deploy-ref" \
                  "$DEPLOY_DIR/.last-deploy-sha" \
                  "$DEPLOY_DIR/.last-deploy-ref" || true
          fi

          # --- Path 0: manual workflow_dispatch with explicit ref (highest priority) ---
          if [ -n "${ROLLBACK_REF:-}" ]; then
            echo "==> Manual rollback: using ref from input: $ROLLBACK_REF"
            PREV_SHA="$ROLLBACK_REF"
            PREV_REF="manual-dispatch"
            PREV_SOURCE="workflow_dispatch input"
            echo "✅ Resolved via $PREV_SOURCE"
            {
              echo "PREV_SHA=$PREV_SHA"
              echo "PREV_REF=$PREV_REF"
              echo "PREV_SOURCE=$PREV_SOURCE"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_SHA=""
          PREV_REF=""
          PREV_SOURCE=""

          # --- Path 1: .rollback-before-deploy-sha (anchor set by previous good deploy) ---
          if [ -f "$DEPLOY_DIR/.rollback-before-deploy-sha" ] && [ -s "$DEPLOY_DIR/.rollback-before-deploy-sha" ]; then
            PREV_SHA=$(tr -d '[:space:]' < "$DEPLOY_DIR/.rollback-before-deploy-sha")
            PREV_REF=$(tr -d '[:space:]' < "$DEPLOY_DIR/.rollback-before-deploy-ref" 2>/dev/null || echo "main")
            PREV_SOURCE=".rollback-before-deploy-sha (local file)"
          fi

          # --- Path 2: .last-deploy-sha (current VPS state) ---
          if [ -z "$PREV_SHA" ]; then
            if [ -f "$DEPLOY_DIR/.last-deploy-sha" ] && [ -s "$DEPLOY_DIR/.last-deploy-sha" ]; then
              PREV_SHA=$(tr -d '[:space:]' < "$DEPLOY_DIR/.last-deploy-sha")
              PREV_REF=$(tr -d '[:space:]' < "$DEPLOY_DIR/.last-deploy-ref" 2>/dev/null || echo "main")
              PREV_SOURCE=".last-deploy-sha (local file)"
            fi
          fi

          # --- Path 3: git HEAD on /opt/netconsole ---
          if [ -z "$PREV_SHA" ]; then
            if [ -d "$DEPLOY_DIR/.git" ]; then
              PREV_SHA=$(git -C "$DEPLOY_DIR" rev-parse HEAD 2>/dev/null || echo "")
              PREV_REF=$(git -C "$DEPLOY_DIR" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
              PREV_SOURCE="git HEAD on /opt/netconsole"
            fi
          fi

          # --- Path 4: hardcoded FALLBACK_SHA (last resort) ---
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "unknown" ]; then
            if [ -n "${FALLBACK_SHA:-}" ]; then
              PREV_SHA="$FALLBACK_SHA"
              PREV_REF="${FALLBACK_REF:-main}"
              PREV_SOURCE="hardcoded FALLBACK_SHA (markers missing/corrupt)"
              echo "::warning::All marker sources failed; using hardcoded fallback. Update FALLBACK_SHA in rollback.yml if needed."
            fi
          fi

          if [ -z "$PREV_SHA" ]; then
            echo "::error::FATAL: no rollback target resolvable from any source (marker files, git, FALLBACK_SHA)."
            echo "::error::This should never happen — FALLBACK_SHA is hardcoded in rollback.yml."
            echo "::error::Check that the env: FALLBACK_SHA rendered correctly above."
            exit 1
          fi

          echo "✅ Resolved rollback target:"
          echo "    PREV_SHA    = $PREV_SHA"
          echo "    PREV_REF    = $PREV_REF"
          echo "    PREV_SOURCE = $PREV_SOURCE"

          {
            echo "PREV_SHA=$PREV_SHA"
            echo "PREV_REF=$PREV_REF"
            echo "PREV_SOURCE=$PREV_SOURCE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout previous (good) commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.marker.outputs.PREV_SHA }}
          fetch-depth: 1
          path: src

      - name: Sync good commit to ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          echo "==> Syncing SHA ${{ steps.marker.outputs.PREV_SHA }} to $DEPLOY_DIR"
          rsync -a --delete \
            --exclude '/.git/hooks/' \
            --exclude '/.git/info/' \
            --exclude '/data/' \
            --exclude '/volumes/' \
            --exclude '/netconsole-app.tar.gz' \
            --exclude '/.tmp-hello.txt' \
            --exclude '/.tmp-cfg/' \
            --exclude '/scripts/ci-rsa-*.bak' \
            --exclude '*.pid' \
            --exclude '/logs/' \
            --exclude '/backups/' \
            --exclude '/.last-deploy-*' \
            --exclude '/.rollback-before-deploy-*' \
            ./src/ "$DEPLOY_DIR/"
          echo "✅ Synced to $DEPLOY_DIR"

      - name: Rebuild and restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -uo pipefail
          # Safe rebuild: try with --build first (the normal path). If the build
          # itself fails (e.g. the previous SHA's code no longer builds), fall
          # back to recreating containers from cached images without rebuilding.
          # The cached image still has the OLD compiled binary — that's exactly
          # what we want: code from the previous successful deploy, not the
          # failing commit's code.
          #
          # The backend startup script (scripts/docker-start.sh) is resilient:
          # it never blocks container start even if prisma db push fails due
          # to schema drift between the rolled-back schema.prisma and the DB.
          echo "==> Building + recreating containers (attempt 1: with --build)..."
          if docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" \
               up -d --build --no-deps $DEPLOY_SERVICES; then
            echo "✅ Build + recreate succeeded"
            exit 0
          fi

          echo "::warning::Build failed — falling back to recreate from cached images"
          echo "==> Attempt 2: recreate without --build (use cached image for the rolled-back SHA)"
          if docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" \
               up -d --no-deps $DEPLOY_SERVICES; then
            echo "✅ Recreate from cached images succeeded"
            exit 0
          fi

          echo "::warning::Recreate failed — trying compose restart as last resort"
          echo "==> Attempt 3: restart existing containers (if any survived)"
          if docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" \
               restart $DEPLOY_SERVICES 2>&1; then
            echo "✅ Restart succeeded"
            exit 0
          fi

          echo "::error::All recovery attempts failed. Containers are down."
          echo "::error::Manual fix: ssh to VPS and run 'cd /opt/netconsole && docker compose -p netconsole -f docker-compose.app.yml up -d --build'"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps || true
          exit 1

      - name: Health-check restored deploy
        run: |
          set -euo pipefail
          echo "Waiting for backend after rollback..."
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 3 http://172.31.0.3:3000/api/health; then
              echo "✅ Backend healthy after rollback (attempt $i)"
              break
            fi
            echo "  attempt $i: not ready, sleeping 2s"
            sleep 2
          done

          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8443/ || echo "000")
          if [ "$code" != "200" ]; then
            echo "::error::Frontend still unreachable after rollback (HTTP $code)"
            docker logs --tail 30 netconsole-frontend || true
            exit 1
          fi
          echo "✅ Frontend OK after rollback (HTTP $code)"

      - name: Update deploy marker after rollback
        run: |
          set -uo pipefail
          # Pure local writes (runner IS the VPS — see deploy.yml for the same pattern).
          mkdir -p "$DEPLOY_DIR"
          printf '%s\n' "${{ steps.marker.outputs.PREV_SHA }}" > "$DEPLOY_DIR/.last-deploy-sha"
          printf '%s\n' "${{ steps.marker.outputs.PREV_REF }}" > "$DEPLOY_DIR/.last-deploy-ref"
          cp "$DEPLOY_DIR/.last-deploy-sha" "$DEPLOY_DIR/.rollback-before-deploy-sha"
          cp "$DEPLOY_DIR/.last-deploy-ref" "$DEPLOY_DIR/.rollback-before-deploy-ref"
          echo "✅ Marker updated on VPS:"
          echo "    .last-deploy-sha           = $(cat "$DEPLOY_DIR/.last-deploy-sha")"
          echo "    .rollback-before-deploy-sha= $(cat "$DEPLOY_DIR/.rollback-before-deploy-sha")"

      - name: Final state after rollback
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "## ⏪ Auto-rollback complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Now running: \`${{ steps.marker.outputs.PREV_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Previous ref: \`${{ steps.marker.outputs.PREV_REF }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Marker source: \`${{ steps.marker.outputs.PREV_SOURCE }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Failed commit (triggered rollback): \`${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "--- Container status ---"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps || true

# =============================================================================
# NetConsole Auto-Rollback — isolated from bad deploy commits
#
# HOW IT WORKS (critical design):
#   This workflow is triggered by `workflow_run` when deploy.yml fails.
#   A `workflow_run` trigger ALWAYS runs this workflow file from the DEFAULT
#   BRANCH (main), NOT from the commit that triggered the failure.
#   This means a bad commit that modifies deploy.yml CANNOT break rollback.
#
# TRIGGER CHAIN:
#   Bad push → deploy.yml (fails) → triggers rollback.yml (from main branch)
#   → reads marker from VPS → rebuilds good commit → service restored
#
# MARKER LOGIC:
#   deploy.yml saves .last-deploy-sha BEFORE deploying. If deploy succeeds,
#   it updates .rollback-before-deploy-sha to the good SHA. If deploy fails,
#   rollback.yml reads .rollback-before-deploy-sha (the good pre-deploy SHA).
#
# PRIORITIES:
#   1. .rollback-before-deploy-sha — set by the PREVIOUS successful deploy
#   2. .last-deploy-sha — current VPS HEAD (from .git/), fallback only
#   3. git rev-parse HEAD — last resort, same as .last-deploy-sha
#
# SCHEMA DRIFT SAFETY (fixed 2026-09-15):
#   The backend container now uses scripts/docker-start.sh, which runs
#   `prisma db push --accept-data-loss` and proceeds to start the backend
#   regardless of its exit code. This means rollback ALWAYS brings the
#   service up — even when the rolled-back schema.prisma differs from the
#   DB's current schema. Field-level API errors may occur until the next
#   correct deploy, but the service is live and healthchecks pass.
# =============================================================================
name: Rollback

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  # Allow manual rollback from GitHub Actions UI.
  # Useful when the auto-rollback cannot reach the VPS (e.g. SSH auth issue,
  # marker file missing) and ops needs to specify an exact known-good SHA.
  workflow_dispatch:
    inputs:
      ref:
        description: "Known-good git ref (branch / tag / sha) to roll back to"
        required: false
        default: ""
      clear_markers:
        description: "Wipe .rollback-before-deploy-* on the VPS before running (used when markers are stale/corrupt)"
        required: false
        default: "false"

# Prevent concurrent deploy+rollback on the same VPS.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  COMPOSE_PROJECT: netconsole
  DEPLOY_SERVICES: "backend worker frontend"

jobs:
  rollback:
    name: Auto-rollback to last known-good
    runs-on: self-hosted
    # Only trigger on failure of the Deploy workflow.
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 20

    steps:
      - name: Set up job
        run: |
          echo "## ⏪ Auto-rollback triggered by failed Deploy run"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏪ **Auto-rollback triggered** by failed Deploy run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggering run: [${{ github.event.workflow_run.name }} #${GITHUB_EVENT_WORKFLOW_RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})" >> $GITHUB_STEP_SUMMARY
          echo "Triggering commit: \`${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Display rollback target info
        run: |
          echo "==> Rollback target: ${{ env.DEPLOY_DIR }}"
          echo "==> This workflow file is from: ${{ github.ref }} (${{ github.sha }})"
          echo "==> Workflow run: ${{ github.event.workflow_run.html_url }}"

      # ── SSH + git access ──────────────────────────────────────────────────────
      - name: Configure SSH known hosts + key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          # Runner stores deploy key at ~runner/.ssh/id_ed25519
          # Retry a few times in case runner is still spinning up from previous job.
          for attempt in 1 2 3; do
            if [ -f ~/.ssh/id_ed25519 ]; then
              chmod 600 ~/.ssh/id_ed25519
              echo "✅ SSH key found (~/.ssh/id_ed25519) on attempt $attempt"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  SSH key not ready (attempt $attempt/3), waiting 5s..."
              sleep 5
            fi
          done

      - name: Read last known-good marker from VPS
        id: marker
        # When invoked manually via workflow_dispatch with `ref` set, skip the
        # VPS marker read entirely — ops specifies the exact git ref to roll
        # back to. The auto-rollback path (no inputs) keeps the original
        # 3-tier priority logic.
        run: |
          set -euo pipefail

          INPUT_REF='${{ inputs.ref }}'
          CLEAR_MARKERS='${{ inputs.clear_markers }}'

          # Manual dispatch with explicit ref — use it directly, no VPS probe.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_REF" ]; then
            echo "==> Manual rollback: using ref from workflow_dispatch input: $INPUT_REF"
            # Allow branch/tag/sha inputs. GitHub Actions "ref" can be a branch,
            # tag, or full SHA. We treat all as-is.
            PREV_SHA="$INPUT_REF"
            PREV_REF="manual-dispatch"
            echo "PREV_SHA=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "PREV_REF=$PREV_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Optional: clear stale marker files before reading.
          if [ "$CLEAR_MARKERS" = "true" ]; then
            echo "==> Clearing VPS rollback markers as requested"
            ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
              'rm -f "$DEPLOY_DIR/.rollback-before-deploy-sha" \
                     "$DEPLOY_DIR/.rollback-before-deploy-ref" \
                     "$DEPLOY_DIR/.last-deploy-sha" \
                     "$DEPLOY_DIR/.last-deploy-ref"' || true
          fi

          ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            'mkdir -p "$DEPLOY_DIR"'

          PREV_SHA=""
          PREV_REF=""

          # Priority 1: rollback-before-deploy-sha (set by the previous SUCCESSFUL deploy)
          # This is the SHA we deployed FROM — safe to roll back to.
          if ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
                "[ -f \"$DEPLOY_DIR/.rollback-before-deploy-sha\" ] && \
                 [ -s \"$DEPLOY_DIR/.rollback-before-deploy-sha\" ]"; then
            PREV_SHA=$(ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
              'cat "$DEPLOY_DIR/.rollback-before-deploy-sha" 2>/dev/null | tr -d "[:space:]"')
            PREV_REF=$(ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
              'cat "$DEPLOY_DIR/.rollback-before-deploy-ref" 2>/dev/null | tr -d "[:space:]"' || echo "unknown")
            if [ -n "$PREV_SHA" ]; then
              echo "✅ Using rollback-before-deploy marker: sha=$PREV_SHA ref=$PREV_REF"
            fi
          fi

          # Priority 2: last-deploy-sha (fallback if rollback-before not set)
          if [ -z "$PREV_SHA" ]; then
            if ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
                  "[ -f \"$DEPLOY_DIR/.last-deploy-sha\" ] && \
                   [ -s \"$DEPLOY_DIR/.last-deploy-sha\" ]"; then
              PREV_SHA=$(ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
                'cat "$DEPLOY_DIR/.last-deploy-sha" 2>/dev/null | tr -d "[:space:]"')
              PREV_REF=$(ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
                'cat "$DEPLOY_DIR/.last-deploy-ref" 2>/dev/null | tr -d "[:space:]"' || echo "unknown")
              if [ -n "$PREV_SHA" ]; then
                echo "✅ Using last-deploy marker: sha=$PREV_SHA ref=$PREV_REF"
              fi
            fi
          fi

          # Priority 3: git HEAD on VPS (fresh VPS with no marker)
          if [ -z "$PREV_SHA" ]; then
            PREV_SHA=$(ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
              'cd "$DEPLOY_DIR" && git rev-parse HEAD 2>/dev/null' || echo "")
            PREV_REF=$(ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
              'cd "$DEPLOY_DIR" && git rev-parse --abbrev-ref HEAD 2>/dev/null' || echo "main")
            if [ -n "$PREV_SHA" ]; then
              echo "✅ Using VPS git HEAD: sha=$PREV_SHA ref=$PREV_REF"
            fi
          fi

          if [ -z "$PREV_SHA" ]; then
            echo "::error::No rollback marker found on VPS at $DEPLOY_DIR and git repo unavailable."
            echo "::error::Re-run this workflow with workflow_dispatch and provide ref=<sha> input."
            exit 1
          fi

          echo "PREV_SHA=$PREV_SHA" >> "$GITHUB_OUTPUT"
          echo "PREV_REF=$PREV_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout previous (good) commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.marker.outputs.PREV_SHA }}
          fetch-depth: 1
          path: src

      - name: Sync good commit to ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          echo "==> Syncing SHA ${{ steps.marker.outputs.PREV_SHA }} to $DEPLOY_DIR"
          rsync -a --delete \
            --exclude '/.git/hooks/' \
            --exclude '/.git/info/' \
            --exclude '/data/' \
            --exclude '/volumes/' \
            --exclude '/netconsole-app.tar.gz' \
            --exclude '/.tmp-hello.txt' \
            --exclude '/.tmp-cfg/' \
            --exclude '/scripts/ci-rsa-*.bak' \
            --exclude '*.pid' \
            --exclude '/logs/' \
            --exclude '/backups/' \
            --exclude '/.last-deploy-*' \
            --exclude '/.rollback-before-deploy-*' \
            ./src/ "$DEPLOY_DIR/"
          echo "✅ Synced to $DEPLOY_DIR"

      - name: Rebuild and restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Safe rebuild: use `up --build` directly without stop+rm.
          # Compose recreates only containers whose image needs rebuilding.
          # If build fails, old containers STAY RUNNING — service preserved.
          #
          # The backend startup script (scripts/docker-start.sh) is resilient:
          # it never blocks container start even if prisma db push fails due
          # to schema drift between the rolled-back schema.prisma and the DB.
          echo "==> Building + recreating containers..."
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" \
            up -d --build --no-deps $DEPLOY_SERVICES

      - name: Health-check restored deploy
        run: |
          set -euo pipefail
          echo "Waiting for backend after rollback..."
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 3 http://172.31.0.3:3000/api/health; then
              echo "✅ Backend healthy after rollback (attempt $i)"
              break
            fi
            echo "  attempt $i: not ready, sleeping 2s"
            sleep 2
          done

          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8443/ || echo "000")
          if [ "$code" != "200" ]; then
            echo "::error::Frontend still unreachable after rollback (HTTP $code)"
            docker logs --tail 30 netconsole-frontend || true
            exit 1
          fi
          echo "✅ Frontend OK after rollback (HTTP $code)"

      - name: Update deploy marker after rollback
        run: |
          set -euo pipefail
          ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
            'mkdir -p "$DEPLOY_DIR"
             printf "%s\n" "$1" > "$DEPLOY_DIR/.last-deploy-sha"
             printf "%s\n" "$2" > "$DEPLOY_DIR/.last-deploy-ref"
             cp "$DEPLOY_DIR/.last-deploy-sha" "$DEPLOY_DIR/.rollback-before-deploy-sha"
             cp "$DEPLOY_DIR/.last-deploy-ref" "$DEPLOY_DIR/.rollback-before-deploy-ref"' \
            _ \
            "${{ steps.marker.outputs.PREV_SHA }}" \
            "${{ steps.marker.outputs.PREV_REF }}"
          echo "✅ Marker updated on VPS"

      - name: Final state after rollback
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "## ⏪ Auto-rollback complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Now running: \`${{ steps.marker.outputs.PREV_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "(was \`${{ steps.marker.outputs.PREV_REF }}\`, failed at \`${{ github.event.workflow_run.head_sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "--- Container status ---"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps || true

# =============================================================================
# NetConsole Rollback - deploy a previous tag to production VPS
# Use case: latest deploy broke production, revert to last known-good tag.
#
# How to use:
#   GitHub → Actions → Rollback → Run workflow
#   Enter a tag like v0.2.0 and the runner will deploy that exact commit.
#
# The script will refuse to deploy a ref that doesn't exist locally OR
# a ref that is not tagged (must be an exact version tag like v*.*.*).
# =============================================================================
name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to roll back to (must match v*.*.*, e.g. v0.2.0)"
        required: true
        type: string
      confirm:
        description: 'Type "ROLLBACK" to confirm. This will deploy immediately.'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  COMPOSE_PROJECT: netconsole
  DEPLOY_SERVICES: "backend worker frontend"

jobs:
  rollback:
    name: Rollback to ${{ inputs.tag }}
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "ROLLBACK" ]; then
            echo "❌ Confirmation text must be exactly ROLLBACK. Got: ${{ inputs.confirm }}"
            exit 1
          fi

      - name: Validate tag format
        run: |
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Tag must match v*.*.* pattern (e.g. v0.2.0). Got: $TAG"
            exit 1
          fi

      - name: Display rollback info
        run: |
          echo "## ⏪ Rollback starting" >> $GITHUB_STEP_SUMMARY
          echo "- **Target tag:** ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** $(hostname)" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: src

      - name: Verify tag exists locally and matches input
        working-directory: src
        run: |
          set -euo pipefail
          ACTUAL=$(git describe --tags --exact-match HEAD)
          if [ "$ACTUAL" != "${{ inputs.tag }}" ]; then
            echo "❌ HEAD is at '$ACTUAL' but requested '${{ inputs.tag }}'"
            exit 1
          fi
          echo "✅ HEAD is exactly at tag $ACTUAL"

      - name: Show commit log
        working-directory: src
        run: |
          echo "## Last 5 commits at ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Backup current release marker
        run: |
          set -euo pipefail
          CURRENT=$(git -C src describe --tags --always 2>/dev/null || echo "none")
          echo "Previous deploy was: $CURRENT"
          echo "PREVIOUS_DEPLOY=$CURRENT" >> $GITHUB_ENV

      - name: Sync source to ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.git' \
            --exclude 'data/' \
            --exclude 'volumes/' \
            --exclude 'netconsole-app.tar.gz' \
            --exclude '.tmp-hello.txt' \
            --exclude '.tmp-cfg/' \
            --exclude 'scripts/ci-rsa-*.bak' \
            --exclude '*.pid' \
            --exclude 'logs/' \
            ./src/ "$DEPLOY_DIR/"

          echo "## Synced contents" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la "$DEPLOY_DIR" | head -25 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build & restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --build --no-deps --remove-orphans $DEPLOY_SERVICES

      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 3 http://172.31.0.3:3000/api/health; then
              echo "✅ Backend healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt $i: not ready yet, sleeping 2s"
            sleep 2
          done

          echo "❌ Backend did not become healthy within 80s"
          echo "--- Last 40 lines of backend log ---"
          docker logs --tail 40 netconsole-backend || true
          exit 1

      - name: Verify frontend reachable
        run: |
          set -euo pipefail
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8443/ || echo "000")
          if [ "$code" = "200" ]; then
            echo "✅ Frontend OK (HTTP $code)"
          else
            echo "❌ Frontend returned HTTP $code"
            docker logs --tail 30 netconsole-frontend || true
            exit 1
          fi

      - name: Final state
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "## ⏪ Rollback complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Now running: \`${{ inputs.tag }}\` (was: \`${{ env.PREVIOUS_DEPLOY }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
# =============================================================================
# NetConsole Deploy - auto-deploy to production VPS via self-hosted runner
# Trigger: push git tag matching v*.*.* (e.g. v0.2.0, v1.0.0)
# Manual: Actions tab -> Deploy -> Run workflow
# =============================================================================
name: Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch / tag / sha). Default: main"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  COMPOSE_PROJECT: netconsole
  DEPLOY_SERVICES: "backend worker frontend"

jobs:
  deploy:
    name: Deploy to production
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Display deployment info
        run: |
          echo "## 🚀 Deploy starting" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** $(hostname)" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          path: src

      - name: Show commit log
        working-directory: src
        run: |
          echo "## Last 5 commits" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Sync source to ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          echo "Syncing $GITHUB_WORKSPACE/src -> $DEPLOY_DIR"

          # Preserve user-managed files & gitignored artefacts on the server.
          # --delete ensures removed files in repo are also removed from server,
          # but excludes below protect data we want to keep across deploys.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.git' \
            --exclude 'data/' \
            --exclude 'volumes/' \
            --exclude 'netconsole-app.tar.gz' \
            --exclude '.tmp-hello.txt' \
            --exclude '.tmp-cfg/' \
            --exclude 'scripts/ci-rsa-*.bak' \
            --exclude '*.pid' \
            --exclude 'logs/' \
            ./src/ "$DEPLOY_DIR/"

          echo "--- Synced. DEPLOY_DIR contents:"
          ls -la "$DEPLOY_DIR" | head -25

      - name: Build & restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # --no-deps: don't restart kea/postgres (they hold persistent state)
          echo "Running: docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE up -d --build --no-deps --remove-orphans $DEPLOY_SERVICES"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --build --no-deps --remove-orphans $DEPLOY_SERVICES

      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          echo "Probing backend /api/health via container network..."
          for i in $(seq 1 40); do
            # Backend container's bridge IP (deterministic from compose ipam)
            if curl -sf -o /dev/null --max-time 3 http://172.31.0.3:3000/api/health; then
              echo "✅ Backend healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt $i: not ready yet, sleeping 2s"
            sleep 2
          done

          echo "❌ Backend did not become healthy within 80s"
          echo "--- Last 40 lines of backend log ---"
          docker logs --tail 40 netconsole-backend || true
          exit 1

      - name: Verify frontend reachable
        run: |
          set -euo pipefail
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8443/ || echo "000")
          if [ "$code" = "200" ]; then
            echo "✅ Frontend OK (HTTP $code)"
          else
            echo "❌ Frontend returned HTTP $code"
            echo "--- Frontend log ---"
            docker logs --tail 30 netconsole-frontend || true
            exit 1
          fi

      - name: Verify kea + postgres untouched
        run: |
          # These services hold persistent state; deploy should NOT recreate them.
          echo "Checking persistent services are unchanged..."
          docker ps \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" \
            --filter "name=netconsole-kea-primary" \
            --filter "name=netconsole-kea-standby" \
            --filter "name=netconsole-postgres" \
            --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}"

      - name: Final state
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          echo "## 🎉 Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "----- Final docker compose ps -----"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps

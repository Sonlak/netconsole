# =============================================================================
# NetConsole Deploy - auto-deploy to production VPS via self-hosted runner
#
# Triggers:
#   1. Push a version tag: git tag v0.3.0 && git push --tags
#      → Always deploys the tagged commit.
#
#   2. Push directly to main (after PR merge with branch protection)
#      → Auto-deploys the latest main. Requires branch protection on main
#        so only reviewed PRs can trigger this.
#
#   3. Manual: GitHub Actions UI → Deploy → Run workflow
#      → Deploys any ref you choose.
#
# NOTE: Do NOT push directly to main without a PR review — this will
# trigger a production deploy immediately. Enable branch protection:
#   Settings → Branches → main → "Protect matching branches"
#   → Require pull request before merging: ON
#   → Require status checks to pass before merging: ON  (add "CI" check)
#   → Do NOT allow force pushes
# =============================================================================
name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch / tag / sha). Default: main"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  # NetBox is defined in a separate compose file but is part of the same
  # project (`netconsole`) so all containers share the netconsole bridge
  # network. The deploy workflow includes this file alongside the app
  # file so `docker compose -p netconsole -f app.yml -f netbox.yml` picks
  # up the netbox service on top of the app stack.
  NETBOX_COMPOSE_FILE: /opt/netconsole/docker-compose.netbox.yml
  COMPOSE_PROJECT: netconsole
  # Services to (re)build + restart on every deploy. NetBox is intentionally
  # NOT in this list — its images are pulled by name and the first deploy
  # that adds the file is responsible for `up -d` of the netbox stack. After
  # that, deploys keep netbox untouched (the running container's data
  # volume is what holds the inventory).
  DEPLOY_SERVICES: "backend worker frontend"

jobs:
  deploy:
    name: Deploy to production
    runs-on: self-hosted
    # Phase 3 of the deploy-pipeline perf plan: the deploy job pulls
    # pre-built images from GHCR (built by the push-images job) instead
    # of compiling TypeScript / running apt-get on the VPS.
    #
    # `needs: push-images` is REQUIRED (not optional) — without it, the
    # deploy's `docker compose pull` lands BEFORE push-images finishes
    # pushing the new :main tag, so the deploy silently uses the OLD
    # image. This is a silent failure: the workflow reports "success"
    # and the new code never runs. Re-introduced 2026-10-05 after
    # observing the race on deploy #533.
    #
    # Wall-time cost of the dependency: ~50s (the push-images build time
    # is now sequential with the deploy pull). With multi-stage builds
    # cutting the backend image from 950MB to ~250MB (Phase 4), the
    # pull is faster (~10-20s vs ~55s), so the sequential total is
    # actually competitive with parallel-but-stale.
    needs: push-images
    timeout-minutes: 25

    steps:
      - name: Display deployment info
        run: |
          echo "## 🚀 Deploy starting" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** $(hostname)" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          path: src

      - name: Show commit log
        working-directory: src
        run: |
          echo "## Last 5 commits" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Save rollback marker BEFORE we touch anything. This preserves the
      # LAST SUCCESSFUL deploy so we can always roll back to it.
      # - .rollback-before-deploy-sha = commit currently running on VPS (never overwritten by failures)
      # - .last-deploy-sha            = updated after each SUCCESS (the "normal" path)
      - name: Save rollback marker (current VPS state — before deploy)
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"

          # IMPORTANT: Only write this backup ONCE. Once set, it is the anchor
          # for the entire rollback chain. Overwriting it with a mid-deploy
          # SHA (e.g. deploy-2 started while deploy-1 was still failing) would
          # make the rollback chain point to the wrong commit.
          # This block is intentionally NOT inside a loop — idempotent by design.
          if [ ! -f "$DEPLOY_DIR/.rollback-before-deploy-sha" ]; then
            if [ -f "$DEPLOY_DIR/.last-deploy-sha" ] && [ -s "$DEPLOY_DIR/.last-deploy-sha" ]; then
              cp "$DEPLOY_DIR/.last-deploy-sha" "$DEPLOY_DIR/.rollback-before-deploy-sha"
              cp "$DEPLOY_DIR/.last-deploy-ref" "$DEPLOY_DIR/.rollback-before-deploy-ref" 2>/dev/null || true
              echo "✅ Backed up current rollback target: $(cat "$DEPLOY_DIR/.rollback-before-deploy-sha")"
            else
              echo "⚠️  No existing .last-deploy-sha to back up — first deploy or git fallback was used"
            fi
          else
            echo "Rollback anchor already exists — NOT overwriting (preserves original good state)"
            echo "Current anchor: $(cat "$DEPLOY_DIR/.rollback-before-deploy-sha")"
          fi

          # The auto-rollback job reads .last-deploy-sha, so we must
          # preserve the CURRENT (pre-deploy) state there.
          # Read it now; if it doesn't exist or is empty, read from git HEAD on VPS.
          if [ -f "$DEPLOY_DIR/.last-deploy-sha" ] && [ -s "$DEPLOY_DIR/.last-deploy-sha" ]; then
            CURRENT_SHA=$(cat "$DEPLOY_DIR/.last-deploy-sha")
            CURRENT_REF=$(cat "$DEPLOY_DIR/.last-deploy-ref" 2>/dev/null || echo "unknown")
          else
            # Fallback: read git HEAD from the deployed source tree
            if [ -d "$DEPLOY_DIR/.git" ]; then
              CURRENT_SHA=$(git -C "$DEPLOY_DIR" rev-parse HEAD 2>/dev/null || echo "unknown")
              CURRENT_REF=$(git -C "$DEPLOY_DIR" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
              echo "⚠️  No .last-deploy-sha found; using git HEAD: sha=$CURRENT_SHA"
            else
              CURRENT_SHA="unknown"
              CURRENT_REF="unknown"
              echo "⚠️  No marker and no git repo at $DEPLOY_DIR. First deploy?"
            fi
          fi
          printf '%s\n' "$CURRENT_SHA" > "$DEPLOY_DIR/.last-deploy-sha"
          printf '%s\n' "$CURRENT_REF" > "$DEPLOY_DIR/.last-deploy-ref"
          printf '%s\n' "push" > "$DEPLOY_DIR/.last-deploy-event"
          echo "💾 Pre-deploy rollback marker saved: sha=$CURRENT_SHA ref=$CURRENT_REF"

      - name: Sync source to ${{ env.DEPLOY_DIR }}
        env:
          SOURCE_DIR: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          echo "Syncing $SOURCE_DIR -> $DEPLOY_DIR"

          # Pre-flight: ensure both source and deploy dirs exist. Self-hosted
          # runner $HOME leak was causing `./src/` relative-path rsync to fail.
          # Pinning to ${{ github.workspace }}/src fixes that.
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::SOURCE_DIR does not exist: $SOURCE_DIR"
            echo "  pwd                   = $(pwd)"
            echo "  GITHUB_WORKSPACE      = ${GITHUB_WORKSPACE:-<unset>}"
            ls -la "${GITHUB_WORKSPACE:-/nonexistent}" 2>&1 | head -10 || true
            exit 1
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "::error::DEPLOY_DIR does not exist: $DEPLOY_DIR"
            exit 1
          fi

          # Preserve user-managed files & gitignored artefacts on the server.
          # --delete ensures removed files in repo are also removed from server,
          # but excludes below protect data we want to keep across deploys.
          #
          # IMPORTANT: all excludes are anchored with a leading slash so they
          # only match repo-root paths. Without the anchor, patterns like
          # `data/` would also wipe source-tree folders such as
          # `frontend/src/data/`, which broke the frontend build for weeks.
          #
          # --ignore-errors + tolerating rsync exit 23/24:
          #   The self-hosted runner on /opt/netconsole often has read-only or
          #   root-owned leftover files from prior Docker builds. Plain rsync
          #   returns 23 ("Some files could not be transferred") on permission
          #   errors; 24 = "files disappeared before transfer". Both are benign.
          #   We log them but do NOT fail the step — source files copy fine.
          set +e
          rsync -a --delete --ignore-errors \
            --exclude '/.git/hooks/' \
            --exclude '/.git/info/' \
            --exclude '/data/' \
            --exclude '/volumes/' \
            --exclude '/netconsole-app.tar.gz' \
            --exclude '/.tmp-hello.txt' \
            --exclude '/.tmp-cfg/' \
            --exclude '/scripts/ci-rsa-*.bak' \
            --exclude '*.pid' \
            --exclude '/logs/' \
            --exclude '/backups/' \
            "$SOURCE_DIR/" "$DEPLOY_DIR/"
          rsync_rc=$?
          set -e
          if [ "$rsync_rc" -eq 0 ]; then
            echo "✅ rsync completed cleanly"
          elif [ "$rsync_rc" -eq 23 ] || [ "$rsync_rc" -eq 24 ]; then
            echo "::warning::rsync returned $rsync_rc (partial transfer — benign). Continuing deploy."
          else
            echo "::error::rsync failed with exit code $rsync_rc"
            exit "$rsync_rc"
          fi

          echo "--- Synced. DEPLOY_DIR contents:"
          ls -la "$DEPLOY_DIR" | head -25

      - name: Build & restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          # Pass the running commit SHA into docker compose so the prod
          # overlay (docker-compose.app.prod.yml) can pin the image tag
          # to exactly the SHA that push-images just pushed. Combined
          # with `needs: push-images` above, this eliminates the race
          # condition where a parallel deploy could pull a stale image.
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Stop + rm old containers FIRST so we can pull fresh images
          # without "container name conflict" errors from docker compose.
          # --no-deps: don't touch kea/postgres (they hold persistent state)
          echo "==> Stopping old containers..."
          docker compose -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" -f "$DEPLOY_DIR/docker-compose.app.prod.yml" \
            stop $DEPLOY_SERVICES || true
          echo "==> Removing old containers..."
          docker compose -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" -f "$DEPLOY_DIR/docker-compose.app.prod.yml" \
            rm -sf $DEPLOY_SERVICES || true
          echo "==> Pulling fresh images from GHCR (tag: main)..."
          docker compose -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" -f "$DEPLOY_DIR/docker-compose.app.prod.yml" \
            pull $DEPLOY_SERVICES
          # Pull OPENAI_API_KEY from the GitHub Actions secret store and pass
          # it to docker compose via the .env substitution. The compose file
          # uses `${OPENAI_API_KEY:-}` so a missing secret keeps the assistant
          # endpoint disabled (returns 503 with a clear error) rather than
          # crashing the backend on startup. The cost is a 2-line change in
          # docker-compose.app.yml — the backend already checks for the env
          # var at first request, not at process start.
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> "$DEPLOY_DIR/.env"
          echo "OPENAI_MODEL=gpt-4.1-mini" >> "$DEPLOY_DIR/.env"
          echo "==> Starting fresh containers..."
          # NOTE: NO --build flag. Images are built in CI (push-images job)
          # and pulled here. This is Phase 3 of the deploy-pipeline perf plan:
          # the VPS no longer compiles TypeScript / runs apt-get — it just
          # pulls a pre-baked image and restarts the container.
          docker compose -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" -f "$DEPLOY_DIR/docker-compose.app.prod.yml" \
            --env-file "$DEPLOY_DIR/.env" \
            up -d --no-deps $DEPLOY_SERVICES

          # ── NetBox stack ────────────────────────────────────────────
          # Bring up the netbox compose side-by-side. We do NOT rebuild it
          # on every deploy — the netbox image is `netboxcommunity/netbox:v4.x`
          # and the data lives in the `netbox_pgdata` volume. Once up, the
          # netbox services are never restarted by future deploys (only the
          # app services above get rebuilt).
          #
          # On first deploy: `up -d` pulls + starts everything. The init
          # script in lab/netbox/init/01-init.py runs on first boot, sets
          # the API token, custom field, and tag.
          #
          # On subsequent deploys: the service definitions are already
          # known to the `netconsole` project (because both compose files
          # share COMPOSE_PROJECT). The `up -d` here is a no-op for the
          # running services but will pull the latest netboxcommunity/netbox
          # image if the tag in docker-compose.netbox.yml changed.
          if [ -f "$NETBOX_COMPOSE_FILE" ]; then
            echo "==> Bringing up NetBox stack..."
            # Use both compose files in the SAME docker compose invocation
            # so they share the project + network. The `netbox` service in
            # docker-compose.app.yml (the placeholder) gets merged with
            # the real definition here.
            #
            # --force-recreate on netbox specifically so a config change
            # in docker-compose.netbox.yml (e.g. ports mapping) actually
            # rebuilds the container. Without this flag Docker Compose is
            # a no-op for already-running services and the container keeps
            # its old bind address. The volume (`netbox_pgdata`) survives
            # the recreate — only the ephemeral container changes.
            docker compose \
              -p "$COMPOSE_PROJECT" \
              -f "$COMPOSE_FILE" \
              -f "$NETBOX_COMPOSE_FILE" \
              up -d --force-recreate netbox || {
                echo "::warning::NetBox recreate failed; backend will retry sync when netbox is available"
              }
            # Postgres + Redis: bring up only if not running (idempotent).
            docker compose \
              -p "$COMPOSE_PROJECT" \
              -f "$COMPOSE_FILE" \
              -f "$NETBOX_COMPOSE_FILE" \
              up -d netbox-postgres netbox-redis || true
          else
            echo "::notice::$NETBOX_COMPOSE_FILE not found on VPS; skipping netbox (run \`rsync\` first or check the file was committed)"
          fi

      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          echo "Probing backend /api/health via container network..."
          # Tuned: 80s baseline -> 90s for first-boot safety.
          # Observations from real deploys:
          #   - Warm deploy (no Dockerfile change): backend ready in 15-25s.
          #   - First deploy after Dockerfile change (npm install -> npm ci):
          #     backend was NOT ready by 60s on the latest attempts, only
          #     became healthy ~70-90s after container start (manual log
          #     inspection confirmed: pg_isready + prisma migrate + db push
          #     + node startup + API bind on slow VPS disks pushes past 60s).
          #   - 90s gives a 4-5x margin over the warm path while leaving
          #     a single ~10s safety net for the cold path.
          # To revert to baseline (80s) or aggressive (60s), edit this block.
          for i in $(seq 1 45); do
            # Backend container's bridge IP (deterministic from compose ipam).
            # Note: the backend startup script (scripts/docker-start.sh) applies
            # schema migrations resiliently — it NEVER blocks container start,
            # even if prisma db push fails due to data-loss. The backend binary
            # starts as soon as Prisma steps complete (or skip), so this probe
            # waits for that to settle.
            if curl -sf -o /dev/null --max-time 3 http://172.31.0.3:3000/api/health; then
              echo "✅ Backend healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt $i: not ready yet, sleeping 2s"
            sleep 2
          done

          echo "❌ Backend did not become healthy within 90s"
          echo "--- Last 40 lines of backend log ---"
          docker logs --tail 40 netconsole-backend || true
          exit 1

      - name: Verify frontend reachable
        run: |
          set -euo pipefail
          sleep 3
          # Plain HTTP on 8443 (was HTTPS until 2026-09-08 / commit a5c395c).
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8443/ || echo "000")
          if [ "$code" = "200" ]; then
            echo "✅ Frontend OK (HTTP $code)"
          else
            echo "❌ Frontend returned HTTP $code"
            echo "--- Frontend log ---"
            docker logs --tail 30 netconsole-frontend || true
            exit 1
          fi

      - name: Verify kea + postgres untouched
        run: |
          # These services hold persistent state; deploy should NOT recreate them.
          echo "Checking persistent services are unchanged..."
          docker ps \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" \
            --filter "name=netconsole-kea-primary" \
            --filter "name=netconsole-kea-standby" \
            --filter "name=netconsole-postgres" \
            --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}"

      - name: Save deploy marker (for future auto-rollback)
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          # Persist current deploy so a future failed deploy can roll back to it.
          printf '%s\n' "$SHA" > "$DEPLOY_DIR/.last-deploy-sha"
          printf '%s\n' "$REF" > "$DEPLOY_DIR/.last-deploy-ref"
          printf '%s\n' "$EVENT" > "$DEPLOY_DIR/.last-deploy-event"
          echo "💾 Saved deploy marker: sha=$SHA ref=$REF event=$EVENT"

          # Update the immutable rollback anchor so next failure rolls back to THIS.
          # This is safe because we just wrote .last-deploy-sha with the good SHA.
          cp "$DEPLOY_DIR/.last-deploy-sha" "$DEPLOY_DIR/.rollback-before-deploy-sha"
          cp "$DEPLOY_DIR/.last-deploy-ref" "$DEPLOY_DIR/.rollback-before-deploy-ref"
          echo "💾 Updated rollback anchor to this successful deploy: sha=$SHA"

      - name: Open iptables port for NetBox (8080)
        run: |
          set +e
          # NetBox publishes 8080 → 8080 inside the container. The
          # self-hosted runner can reach it locally, but the worker
          # container is on the same docker bridge and CANNOT reach the
          # host's port mapping via the service-name DNS (unreliable on
          # the VPS). Instead we point the worker at the public IP.
          #
          # PORT 8080 was chosen because 8001 is already used by
          # netconsole-kea-primary (mapped to 10.10.20.20:8001). Trying
          # to bind the same host port causes Docker to fail with
          # "Bind for 10.10.20.20:8001 failed: port is already allocated"
          # which silently bricks the netbox container.
          #
          # Docker adds a NAT rule for the published port automatically,
          # but the public-NIC INPUT chain might still drop the packet
          # depending on the host's default policy. Append an explicit
          # ACCEPT rule (idempotent — duplicates are OK; we de-dupe by
          # checking for the comment).
          #
          # Try with sudo (non-interactive), fall back to plain iptables
          # (works when the runner is in a sudoers passwordless setup or
          # already root). Final fallback: print the manual command.
          ADD_RULE() {
            iptables -C INPUT -p tcp --dport 8080 -j ACCEPT -m comment --comment "netbox-sync" 2>/dev/null && {
              echo "iptables rule for :8080 already present — skipping"
              return 0
            }
            if command -v sudo >/dev/null 2>&1; then
              sudo -n iptables -I INPUT -p tcp --dport 8080 -j ACCEPT -m comment --comment "netbox-sync" 2>&1 && return 0
            fi
            iptables -I INPUT -p tcp --dport 8080 -j ACCEPT -m comment --comment "netbox-sync" 2>&1 && return 0
            echo "::warning::failed to add iptables rule for :8080"
            echo "  Run manually on VPS:"
            echo "    sudo iptables -I INPUT -p tcp --dport 8080 -j ACCEPT -m comment --comment netbox-sync"
            return 1
          }
          ADD_RULE || true
          set -e

      - name: Wait for NetBox healthy
        run: |
          set -euo pipefail
          echo "Probing NetBox /api/dcim/sites/?limit=1 ..."

          # Fast path: if the NetBox container is ANY running state, skip the wait.
          # NetBox is NEVER restarted by app deploys (only the app services
          # backend/worker/frontend are rebuilt+recreated; netbox holds the
          # netbox_pgdata volume). So if the container is Up, its API state
          # post-deploy is identical to pre-deploy — there's no reason to
          # block the deploy on a 5-minute probe loop.
          #
          # The previous check required `Up .* (healthy)`, but NetBox can
          # legitimately be Up + unhealthy (e.g. its internal Docker
          # healthcheck on /api/health/ returns 404 because the endpoint
          # isn't enabled, or the NetBox API is wedged). In both cases
          # waiting 5 min is pure waste — the worker just retries on its
          # next sync tick regardless.
          #
          # We do a quick API probe (1 attempt, 5s timeout) to log the
          # state, but we never fail the deploy on NetBox.
          if docker ps --format '{{.Names}}\t{{.Status}}' \
              | grep -E '^(netbox-netbox)\s+Up' >/dev/null 2>&1; then
            echo "==> NetBox container Up — skipping full wait"
            if curl -sf -o /dev/null --max-time 5 "http://127.0.0.1:8080/api/dcim/sites/?limit=1"; then
              echo "✅ NetBox reachable"
            else
              echo "::warning::NetBox container is Up but API probe failed — worker's next sync tick will retry"
            fi
            exit 0
          fi

          # Slow path: NetBox container is missing or being recreated (first
          # deploy, or docker-compose.netbox.yml changed).
          # NetBox first boot does Django migrations + createsuperuser +
          # runs our init script — typical 60-90s. Allow up to 5 minutes.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 5 "http://127.0.0.1:8080/api/dcim/sites/?limit=1"; then
              echo "✅ NetBox healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt $i: not ready yet, sleeping 5s"
            sleep 5
          done
          echo "::warning::NetBox did not become healthy within 5 min — check 'docker logs netbox-netbox'"
          # Non-fatal: the worker's next sync tick will retry, and the
          # human can curl /api/health on the NetBox container to confirm.

      - name: Final state
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          echo "## 🎉 Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "----- Final docker compose ps -----"
          docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps

  # Auto-rollback is handled by .github/workflows/rollback.yml (separate file).
  # Rationale: rollback must NOT be affected by a bad commit that modifies
  # deploy.yml. Using a separate workflow with `workflow_run` trigger means
  # rollback ALWAYS reads its logic from the default-branch (main) version,
  # regardless of which commit triggered the failure.
  # See rollback.yml for the full auto-rollback implementation.

    # Runs in PARALLEL with `deploy` (no `needs:`). Does NOT replace the
    # local-build-on-VPS path used by `deploy` — the registry is an audit
    # trail / rollback artifact, not the production image source.
    #
    # Tags produced:
    #   - ghcr.io/sonlak/netconsole-backend:sha-<7>
    #   - ghcr.io/sonlak/netconsole-backend:v0.4.0    (only on tag push)
    #   - ghcr.io/sonlak/netconsole-backend:latest    (only on main push)
    # Same for worker + frontend.
  push-images:
    name: Push ${{ matrix.service }} to GHCR
    runs-on: ubuntu-latest
    # Run on:
    #   - push to main (auto-deploy on merge)
    #   - push of a v*.*.* tag (release deploy)
    #   - workflow_dispatch (manual deploy; uses dispatched `ref` input)
    # PRs and pushes to other branches do NOT trigger this (and therefore
    # do NOT trigger the deploy job that depends on it).
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    strategy:
      # Run all 3 service images in parallel — saves ~50-60s vs the
      # previous sequential build (49s + 21s + 27s = 97s becomes
      # max(49, 21, 27) + setup ~10s = ~60s).
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: worker
            context: worker
            dockerfile: worker/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch, build the ref the user requested.
          # On push, build the ref that was pushed.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sonlak/netconsole-${{ matrix.service }}
          tags: |
            # Full SHA tag — used by the deploy step to pull EXACTLY this
            # image. Always set (not just on default branch) so workflow_dispatch
            # deploys of any ref can pull a deterministically-named image.
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # `mode=min` (not `max`) because all 3 Dockerfiles use
          # `--mount=type=cache` for apt / pip / npm. `mode=max` tries
          # to export cache-mount content as a layer (which it isn't)
          # and the build fails with a cache-key computation error.
          cache-to: type=gha,mode=min
          build-args: |
            NETCONSOLE_VERSION=${{ github.ref_name }}
            NETCONSOLE_GIT_COMMIT=${{ github.sha }}

      - name: Summary
        if: ${{ matrix.service == 'backend' }}
        run: |
          echo "## 📦 Images pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/sonlak/netconsole-backend" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/sonlak/netconsole-worker" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/sonlak/netconsole-frontend" >> $GITHUB_STEP_SUMMARY

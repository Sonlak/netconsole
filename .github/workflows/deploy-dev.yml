# =============================================================================
# Deploy to DEV/TEST VPS — auto-deploy on every branch push
#
# Runs on: vps-dev-01 (old VPS)
# Triggers on: EVERY branch push (including feature branches)
#
# Use this to test changes before merging to main.
# Only the dev/test VPS is affected — prod is untouched.
#
# Commit flow:
#   git checkout -b feature/my-change
#   git add . && git commit -m "..."
#   git push origin feature/my-change
#   → GitHub Actions triggers deploy-dev.yml
#   → deploys to vps-dev-01
#
# To deploy to prod: merge to main via PR → deploy-prod.yml runs
# =============================================================================
name: Deploy Dev

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  NETBOX_COMPOSE_FILE: /opt/netconsole/docker-compose.netbox.yml
  COMPOSE_PROJECT: netconsole
  DEPLOY_SERVICES: "backend worker frontend redis"

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Display deployment info
        run: |
          echo "## Deploy Dev starting" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** $(hostname) (vps-dev-01)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          path: src

      - name: Show commit log
        working-directory: src
        run: |
          echo "## Last 5 commits" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Last commit: $(git log --oneline -1)"

      - name: Sync source to ${{ env.DEPLOY_DIR }}
        env:
          SOURCE_DIR: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          echo "Syncing $SOURCE_DIR -> $DEPLOY_DIR"
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::SOURCE_DIR does not exist: $SOURCE_DIR"
            exit 1
          fi
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "::error::DEPLOY_DIR does not exist: $DEPLOY_DIR"
            exit 1
          fi
          set +e
          rsync -a --delete --ignore-errors \
            --exclude '/.git/hooks/' \
            --exclude '/.git/info/' \
            --exclude '/data/' \
            --exclude '/volumes/' \
            --exclude '/netconsole-app.tar.gz' \
            --exclude '/.tmp-hello.txt' \
            --exclude '/.tmp-cfg/' \
            --exclude '/scripts/ci-rsa-*.bak' \
            --exclude '*.pid' \
            --exclude '/logs/' \
            --exclude '/backups/' \
            --exclude '/secrets.env' \
            --exclude '/.env' \
            --exclude '/.sops-age-key.txt' \
            "$SOURCE_DIR/" "$DEPLOY_DIR/"
          rsync_rc=$?
          set -e
          if [ "$rsync_rc" -eq 0 ]; then
            echo "rsync OK"
          elif [ "$rsync_rc" -eq 23 ] || [ "$rsync_rc" -eq 24 ]; then
            echo "rsync partial (benign): exit $rsync_rc"
          else
            echo "::error::rsync failed: exit $rsync_rc"
            exit "$rsync_rc"
          fi

      - name: Install SOPS + age
        run: |
          set -euo pipefail
          SOPS_VERSION="3.10.2"
          AGE_VERSION="1.2.1"
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) SOPS_ARCH=amd64; AGE_ARCH=amd64 ;;
            aarch64) SOPS_ARCH=arm64; AGE_ARCH=arm64 ;;
            *) echo "ERROR: unsupported arch: $ARCH"; exit 1 ;;
          esac

          # Skip if already installed
          if command -v sops >/dev/null 2>&1 && \
             [ "$(sops --version 2>/dev/null | grep '^sops' | awk '{print $2}' | sed 's/^v//')" = "$SOPS_VERSION" ] && \
             command -v age >/dev/null 2>&1; then
            echo "sops $SOPS_VERSION + age already installed"
            cd /tmp && rm -rf "$TMPDIR"
            exit 0
          fi

          try_fetch() {
            local url="$1" out="$2"
            if curl -sSLf --max-time 60 -o "$out" "$url" && [ -s "$out" ]; then
              return 0
            fi
            rm -f "$out"
            return 1
          }

          # sops
          echo "Fetching sops v$SOPS_VERSION"
          for url in \
            "https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.$SOPS_ARCH" \
            "https://gh-proxy.com/https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.$SOPS_ARCH"; do
            if try_fetch "$url" sops; then
              echo "  OK: $url"
              break
            fi
          done
          chmod +x sops && sudo install -m 0755 sops /usr/local/bin/sops

          # age
          echo "Fetching age v$AGE_VERSION"
          for url in \
            "https://github.com/FiloSottile/age/releases/download/v$AGE_VERSION/age-v$AGE_VERSION-linux-$AGE_ARCH.tar.gz" \
            "https://gh-proxy.com/https://github.com/FiloSottile/age/releases/download/v$AGE_VERSION/age-v$AGE_VERSION-linux-$AGE_ARCH.tar.gz"; do
            if try_fetch "$url" age.tar.gz; then
              echo "  OK: $url"
              break
            fi
          done
          tar xzf age.tar.gz && sudo install -m 0755 age/age age/age-keygen /usr/local/bin/

          cd /tmp && rm -rf "$TMPDIR"
          echo "sops $(sops --version) | age $(age --version)"

      - name: Decrypt secrets.env.enc
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: /opt/netconsole/.sops-age-key.txt
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if [ ! -f ".sops.yaml" ]; then
            echo "::error::.sops.yaml not found"
            exit 1
          fi

          key_source=""
          if [ -n "${SOPS_AGE_KEY:-}" ]; then
            key_source="GH secret SOPS_AGE_KEY"
          elif [ -f "${SOPS_AGE_KEY_FILE}" ]; then
            key_source="local file ${SOPS_AGE_KEY_FILE}"
          else
            echo "::error::No age key. Set GH secret SOPS_AGE_KEY or copy to ${SOPS_AGE_KEY_FILE}"
            exit 1
          fi
          echo "Decrypting secrets.env (key from: $key_source)"

          bash ./scripts/sops_decrypt.sh

          for required in JWT_SECRET WORKER_AUTH_TOKEN; do
            if ! grep -q "^${required}=" secrets.env; then
              echo "::error::$required missing from decrypted secrets.env"
              exit 1
            fi
          done
          echo "secrets.env OK"

      - name: Build & restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMPOSE_BASE=(docker compose
            -p "$COMPOSE_PROJECT"
            -f "$COMPOSE_FILE" -f "$DEPLOY_DIR/docker-compose.app.prod.yml"
            --env-file "$DEPLOY_DIR/secrets.env"
            --env-file "$DEPLOY_DIR/.env")

          echo "==> Disk check"
          df -h / | head -3 || true
          AVAIL=$(df -BG / | awk 'NR==2 {print $4}' | sed 's/G//')
          if [ "${AVAIL:-0}" -lt 5 ]; then
            echo "Low disk (${AVAIL}G). Pruning..."
            sudo -n docker container prune -f 2>&1 | tail -3 || true
            sudo -n docker image prune -a -f 2>&1 | tail -5 || true
          else
            echo "Disk OK (${AVAIL}G)"
          fi

          echo "==> Stopping services..."
          "${COMPOSE_BASE[@]}" stop $DEPLOY_SERVICES || true
          "${COMPOSE_BASE[@]}" rm -sf $DEPLOY_SERVICES || true

          : > "$DEPLOY_DIR/.env"
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> "$DEPLOY_DIR/.env"
          echo "OPENAI_MODEL=gpt-4o-mini" >> "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env" 2>/dev/null || true

          echo "==> Pulling images from GHCR..."
          "${COMPOSE_BASE[@]}" pull $DEPLOY_SERVICES || echo "Pull warning (non-fatal)"

          if [ -f "$DEPLOY_DIR/secrets.env" ]; then
            chmod 600 "$DEPLOY_DIR/secrets.env"
          fi

          echo "==> Starting services..."
          "${COMPOSE_BASE[@]}" up -d --remove-orphans --no-deps $DEPLOY_SERVICES || {
            echo "Warning: up returned non-zero — sweeping Created containers"
            for svc in $DEPLOY_SERVICES; do
              cid=$(docker ps -a --filter "label=com.docker.compose.service=$svc" --format '{{.ID}}' | head -1)
              if [ -n "$cid" ]; then
                state=$(docker inspect --format '{{.State.Status}}' "$cid" 2>/dev/null || echo unknown)
                if [ "$state" = "created" ]; then
                  echo "  Starting $svc ($cid)"
                  docker start "$cid" || true
                fi
              fi
            done
          }

      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          echo "Probing backend..."
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null --max-time 3 http://172.31.0.3:3000/api/health; then
              echo "Backend healthy (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend not healthy in 90s"
          docker logs --tail 40 netconsole-backend || true
          exit 1

      - name: Verify frontend reachable
        run: |
          set -euo pipefail
          sleep 3
          code=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 5 https://127.0.0.1:8443/ || echo "000")
          if [ "$code" = "200" ]; then
            echo "Frontend OK (HTTPS $code)"
          else
            echo "Frontend returned HTTPS $code"
            docker logs --tail 30 netconsole-frontend || true
            exit 1
          fi

      - name: Final state
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "## Deploy Dev complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose \
            --env-file "$DEPLOY_DIR/secrets.env" --env-file "$DEPLOY_DIR/.env" \
            -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "=== docker compose ps ==="
          docker compose \
            --env-file "$DEPLOY_DIR/secrets.env" --env-file "$DEPLOY_DIR/.env" \
            -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps

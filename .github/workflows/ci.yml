# =============================================================================
# NetConsole CI - lint, test, build (no deploy)
# Runs on every push to main and every PR to main
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netconsole
          POSTGRES_PASSWORD: netconsole
          POSTGRES_DB: netconsole_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://netconsole:netconsole@localhost:5432/netconsole_test?schema=public
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: TypeScript type-check
        run: npx tsc --noEmit 2>&1; echo "EXIT=$?"

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -b --pretty --force 2>&1; echo "EXIT=$?"

      - name: Build
        run: npm run build

  worker:
    name: Worker (lint + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Smoke import
        run: python -c "import main" || python -c "import app" || python -c "import worker" || echo "no top-level entry; skipping"

  compose-validate:
    name: Docker Compose syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.app.yml
        run: |
          docker compose -f docker-compose.app.yml config --quiet && echo "app: OK"
          docker compose -f docker-compose.lab.yml config --quiet && echo "lab: OK"

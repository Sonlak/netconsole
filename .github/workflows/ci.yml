# =============================================================================
# CI: lint + type-check + test + build for backend, frontend, worker, compose
# Runs on every push (including feature branches) and every PR targeting any
# branch. Branch protection on `main` currently enforces only "PR + linear
# history + no force-push" (see scripts/setup_branch_protection.py); CI runs
# here are advisory so failures don't block deploys that go through the
# self-hosted runner on tag pushes.
# =============================================================================
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netconsole
          POSTGRES_PASSWORD: netconsole
          POSTGRES_DB: netconsole_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://netconsole:netconsole@localhost:5432/netconsole_test?schema=public
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: TypeScript type-check (advisory)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (advisory)
        run: npx tsc -b --pretty
        continue-on-error: true
        # NOTE: this step is intentionally non-blocking. The `Build` step below
        # is the source of truth: vite/esbuild still type-strips the code, so
        # a truly broken file will fail there. Type errors that don't break
        # the bundle (e.g. unused vars, exact-optional-property-types) won't
        # block CI but will surface as warnings during `npm run build`.

      - name: Build
        run: npm run build

  worker:
    name: Worker (lint + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.9.0

      - name: Lint with ruff
        run: ruff check .

      - name: Smoke import
        run: python -c "import main" || python -c "import app" || python -c "import worker" || echo "no top-level entry; skipping"

  compose-validate:
    name: Docker Compose syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.app.yml
        run: |
          docker compose -f docker-compose.app.yml config --quiet && echo "app: OK"
          docker compose -f docker-compose.lab.yml config --quiet && echo "lab: OK"

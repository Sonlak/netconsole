# =============================================================================
# NetConsole Deploy to Production VPS — via vps-prod-01
#
# Runs on: vps-prod-01 (new VPS, dedicated production)
#
# Triggers:
#   1. Push a version tag: git tag v0.3.0 && git push --tags
#      → Always deploys the tagged commit.
#
#   2. Push to main (after PR merge with branch protection)
#      → Auto-deploys the latest main. Requires branch protection so
#        only reviewed PRs trigger this.
#
#   3. Manual: GitHub Actions UI → Deploy Prod → Run workflow
#      → Deploys any ref you choose.
#
# DEV/TEST: use deploy-dev.yml (auto-triggers on every branch push)
# =============================================================================
name: Deploy Prod

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch / tag / sha). Default: main"
        required: false
        default: "main"

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/netconsole
  COMPOSE_FILE: /opt/netconsole/docker-compose.app.yml
  NETBOX_COMPOSE_FILE: /opt/netconsole/docker-compose.netbox.yml
  COMPOSE_PROJECT: netconsole
  DEPLOY_SERVICES: "backend worker frontend redis kea-dc1"

jobs:
  deploy:
    name: Deploy to production
    runs-on: vps-prod-01
    needs: push-images
    timeout-minutes: 25

    steps:
      - name: Display deployment info
        run: |
          echo "## Deploy Prod starting" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** $(hostname) (vps-prod-01)" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          path: src

      - name: Show commit log
        working-directory: src
        run: |
          echo "## Last 5 commits" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save rollback marker (current VPS state — before deploy)
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"

          if [ ! -f "$DEPLOY_DIR/.rollback-before-deploy-sha" ]; then
            if [ -f "$DEPLOY_DIR/.last-deploy-sha" ] && [ -s "$DEPLOY_DIR/.last-deploy-sha" ]; then
              cp "$DEPLOY_DIR/.last-deploy-sha" "$DEPLOY_DIR/.rollback-before-deploy-sha"
              cp "$DEPLOY_DIR/.last-deploy-ref" "$DEPLOY_DIR/.rollback-before-deploy-ref" 2>/dev/null || true
              echo "Backed up current rollback target: $(cat "$DEPLOY_DIR/.rollback-before-deploy-sha")"
            else
              echo "No existing .last-deploy-sha to back up"
            fi
          else
            echo "Rollback anchor already exists: $(cat "$DEPLOY_DIR/.rollback-before-deploy-sha")"
          fi

          if [ -f "$DEPLOY_DIR/.last-deploy-sha" ] && [ -s "$DEPLOY_DIR/.last-deploy-sha" ]; then
            CURRENT_SHA=$(cat "$DEPLOY_DIR/.last-deploy-sha")
            CURRENT_REF=$(cat "$DEPLOY_DIR/.last-deploy-ref" 2>/dev/null || echo "unknown")
          else
            if [ -d "$DEPLOY_DIR/.git" ]; then
              CURRENT_SHA=$(git -C "$DEPLOY_DIR" rev-parse HEAD 2>/dev/null || echo "unknown")
              CURRENT_REF=$(git -C "$DEPLOY_DIR" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
            else
              CURRENT_SHA="unknown"; CURRENT_REF="unknown"
            fi
          fi
          printf '%s\n' "$CURRENT_SHA" > "$DEPLOY_DIR/.last-deploy-sha"
          printf '%s\n' "$CURRENT_REF" > "$DEPLOY_DIR/.last-deploy-ref"
          printf '%s\n' "push" > "$DEPLOY_DIR/.last-deploy-event"
          echo "Pre-deploy marker saved: sha=$CURRENT_SHA ref=$CURRENT_REF"

      - name: Sync source to ${{ env.DEPLOY_DIR }}
        env:
          SOURCE_DIR: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          if [ ! -d "$SOURCE_DIR" ] || [ ! -d "$DEPLOY_DIR" ]; then
            echo "::error::Missing dirs: SOURCE=$SOURCE_DIR DEPLOY=$DEPLOY_DIR"
            exit 1
          fi
          set +e
          rsync -a --delete --ignore-errors \
            --exclude '/.git/hooks/' --exclude '/.git/info/' \
            --exclude '/data/' --exclude '/volumes/' \
            --exclude 'node_modules/' --exclude '.venv/' --exclude '__pycache__/' \
            --exclude '/netconsole-app.tar.gz' --exclude '/.tmp-hello.txt' \
            --exclude '/.tmp-cfg/' --exclude '/scripts/ci-rsa-*.bak' \
            --exclude '*.pid' --exclude '/logs/' --exclude '/backups/' \
            --exclude '/secrets.env' --exclude '/.env' \
            --exclude '/.sops-age-key.txt' \
            --exclude '/secrets.age.key' \
            --exclude '/.last-deploy-sha' --exclude '/.last-deploy-ref' \
            --exclude '/.last-deploy-event' \
            --exclude '/.rollback-before-deploy-sha' --exclude '/.rollback-before-deploy-ref' \
            "$SOURCE_DIR/" "$DEPLOY_DIR/"
          rsync_rc=$?
          set -e
          if [ "$rsync_rc" -eq 0 ]; then
            echo "rsync OK"
          elif [ "$rsync_rc" -eq 23 ] || [ "$rsync_rc" -eq 24 ]; then
            echo "rsync partial (benign): exit $rsync_rc"
          else
            echo "::error::rsync failed: exit $rsync_rc"; exit "$rsync_rc"
          fi

      - name: Install SOPS + age
        run: |
          set -euo pipefail
          SOPS_VERSION="3.10.2"; AGE_VERSION="1.2.1"
          TMPDIR=$(mktemp -d); cd "$TMPDIR"
          ARCH=$(uname -m)
          case "$ARCH" in x86_64) SA=amd64; AA=amd64 ;; aarch64) SA=arm64; AA=arm64 ;; *) echo "ERROR: unsupported arch"; exit 1 ;; esac

          if command -v sops >/dev/null 2>&1 && \
             [ "$(sops --version 2>/dev/null | awk '{print $2}' | sed 's/^v//')" = "$SOPS_VERSION" ] && \
             command -v age >/dev/null 2>&1; then
            echo "sops $SOPS_VERSION + age already installed"; cd /tmp && rm -rf "$TMPDIR"; exit 0
          fi

          try_fetch() { local u="$1" o="$2"; curl -sSLf --max-time 60 -o "$o" "$u" && [ -s "$o" ] && return 0; rm -f "$o"; return 1; }

          for url in "https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.$SA" "https://gh-proxy.com/https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.$SA"; do
            try_fetch "$url" sops && echo "sops OK: $url" && break
          done
          chmod +x sops && sudo install -m 0755 sops /usr/local/bin/sops

          for url in "https://github.com/FiloSottile/age/releases/download/v$AGE_VERSION/age-v$AGE_VERSION-linux-$AA.tar.gz" "https://gh-proxy.com/https://github.com/FiloSottile/age/releases/download/v$AGE_VERSION/age-v$AGE_VERSION-linux-$AA.tar.gz"; do
            try_fetch "$url" age.tar.gz && echo "age OK: $url" && break
          done
          tar xzf age.tar.gz && sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
          cd /tmp && rm -rf "$TMPDIR"

      - name: Decrypt secrets.env.enc
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: /opt/netconsole/.sops-age-key.txt
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if [ ! -f "secrets.env.enc" ] || [ ! -f ".sops.yaml" ]; then
            echo "::error::secrets.env.enc or .sops.yaml missing"; exit 1
          fi
          if grep -q "PLACEHOLDER" .sops.yaml; then
            echo "::error::.sops.yaml has PLACEHOLDER — rotate key first"; exit 1
          fi
          key_source=""
          if [ -n "${SOPS_AGE_KEY:-}" ]; then
            key_source="GH secret"
          elif [ -f "${SOPS_AGE_KEY_FILE}" ]; then
            key_source="local file"
          else
            echo "::error::No age key — set SOPS_AGE_KEY in GH secrets or copy to ${SOPS_AGE_KEY_FILE}"; exit 1
          fi
          echo "Decrypting (key from: $key_source)"
          bash ./scripts/sops_decrypt.sh
          for required in JWT_SECRET WORKER_AUTH_TOKEN; do
            if ! grep -q "^${required}=" secrets.env || [ -z "$(grep "^${required}=" secrets.env | cut -d= -f2-)" ]; then
              echo "::error::$required missing/empty in secrets.env"; exit 1
            fi
          done
          echo "secrets.env OK"

      - name: Build & restart app services
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMPOSE_BASE=(docker compose
            -p "$COMPOSE_PROJECT"
            -f "$COMPOSE_FILE" -f "$DEPLOY_DIR/docker-compose.app.prod.yml"
            --env-file "$DEPLOY_DIR/secrets.env"
            --env-file "$DEPLOY_DIR/.env")

          echo "Disk check:"
          df -h / | head -3 || true
          AVAIL=$(df -BG / | awk 'NR==2 {print $4}' | sed 's/G//')
          if [ "${AVAIL:-0}" -lt 5 ]; then
            echo "Low disk (${AVAIL}G). Pruning..."
            sudo -n docker container prune -f 2>&1 | tail -3 || true
            sudo -n docker image prune -a -f 2>&1 | tail -5 || true
            sudo -n docker volume prune -f 2>&1 | tail -3 || true
          else
            echo "Disk OK (${AVAIL}G)"
          fi

          : > "$DEPLOY_DIR/.env"
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> "$DEPLOY_DIR/.env"
          echo "OPENAI_MODEL=gpt-4o-mini" >> "$DEPLOY_DIR/.env"
          # Lab-NIC IP of THIS host (prod). docker-compose.app.yml publishes
          # kea DHCP :67, kea ctrl-agent :8001 and the backend syslog :1514
          # on ${KEA_HOST_IP}. Hardcoded to the dev VPS's 10.10.20.20, Docker
          # refuses to bind it here ("cannot assign requested address") and
          # kea-dc1 never starts -> backend (depends_on kea healthy) never
          # starts -> deploy fails. Dev keeps the default (10.10.20.20).
          #
          # CHANGED 2026-10-22: the switch's DHCP relay points at
          # 192.168.81.171 (ens33, the LAN office NIC) - NOT the lab NIC
          # 10.10.20.40. Verified on the host:
          #   ens33 = 192.168.81.171/24   <- LAN văn phòng (relay target)
          #   ens34 = 10.10.20.40/24       <- lab subnet (peer + syslog src)
          # The old value 10.10.20.40 published DHCP on the wrong NIC, so
          # the switch could never reach the relay helper address.
          echo "KEA_HOST_IP=192.168.81.171" >> "$DEPLOY_DIR/.env"
          # Kea HA "this server" URL - the peer uses it to reach us.
          echo "KEA_SERVER_URL=192.168.81.171" >> "$DEPLOY_DIR/.env"
          # KEA_HA_ENABLED=false (2026-10-22): prod's kea-dc1 runs as a
          # STANDALONE DHCP4 server - the libdhcp_ha hook is not loaded.
          #
          # Why: the DR host does not exist yet, and prod's kea-dc1 was
          # pointed at 10.10.20.30 - the SAME peer the dev/lab VPS's
          # kea-dc1 already uses. Two servers both configured as `primary`
          # sharing one peer is an invalid hot-standby topology; Kea flags
          # the peer mismatch and the state machine stalls. The operator
          # confirmed: prod runs standalone until the DR server is built.
          # Re-enable (together with KEA_PEER_URL) in the same commit that
          # brings up the DR host.
          echo "KEA_HA_ENABLED=false" >> "$DEPLOY_DIR/.env"
          # NetBox UI bind address (2026-10-22): the operator reaches the
          # console over the LAN IP, so NetBox's UI must be reachable the
          # same way. Backend/worker talk to NetBox over the docker bridge
          # at 172.31.0.22 - this publish is for BROWSER access only.
          echo "NETBOX_BIND_IP=192.168.81.171" >> "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env" 2>/dev/null || true

          if ! "${COMPOSE_BASE[@]}" pull $DEPLOY_SERVICES; then
            echo "::warning::image pull reported errors -- continuing with cached images"
          fi

          if [ -f "$DEPLOY_DIR/secrets.env" ]; then
            chmod 600 "$DEPLOY_DIR/secrets.env"
          fi

          # Syslog ingress filter (M1). Devices send syslog to the
          # published :1514 on ${KEA_HOST_IP}. CHANGED 2026-10-22: the
          # published address moved from 10.10.20.40 to 192.168.81.171,
          # and the real device fleet sits on the office LAN
          # 192.168.81.0/24 - so BOTH subnets must be allowed, otherwise
          # the DROP rule silently ate every syslog packet from the
          # devices. The backend also enforces SYSLOG_ALLOWED_CIDRS
          # in-process (see docker-compose.app.yml).
          for subnet in 192.168.81.0/24 10.10.20.0/24; do
            iptables -C INPUT -p udp --dport 1514 -s "$subnet" -j ACCEPT -m comment --comment "netconsole-syslog-allow" 2>/dev/null \
              || sudo -n iptables -I INPUT -p udp --dport 1514 -s "$subnet" -j ACCEPT -m comment --comment "netconsole-syslog-allow" 2>/dev/null \
              || echo "warning: iptables :1514 allow rule for $subnet failed"
          done
          iptables -C INPUT -p udp --dport 1514 ! -s 192.168.81.0/24 ! -s 10.10.20.0/24 -j DROP 2>/dev/null \
            || sudo -n iptables -I INPUT -p udp --dport 1514 ! -s 192.168.81.0/24 ! -s 10.10.20.0/24 -j DROP -m comment --comment "netconsole-syslog" 2>/dev/null \
            || echo "warning: iptables :1514 rule failed"

          echo "==> Starting services (recreate in place)..."
          # Deliberately NOT doing `stop` + `rm -sf` first. Removing the
          # containers up front means any later failure leaves the whole app
          # stack gone and the health check has nothing left to probe, so the
          # real error is lost. `up -d --force-recreate` swaps changed
          # containers in place and keeps the old one up until the new one is
          # created. Dependency order (redis -> backend -> frontend) is also
          # honoured now that --no-deps is gone.
          if ! "${COMPOSE_BASE[@]}" up -d --force-recreate --remove-orphans $DEPLOY_SERVICES; then
            echo "::error::docker compose up failed -- dumping state below"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            "${COMPOSE_BASE[@]}" ps -a || true
            exit 1
          fi

          echo "==> Containers after up"
          docker ps -a --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" \
            --format '{{.Names}} | {{.Status}}' || true

          if [ -f "$NETBOX_COMPOSE_FILE" ]; then
            echo "==> NetBox stack..."
            # CHANGED 2026-10-22: the previous version of this step was
            # broken in two ways and the error was swallowed by
            # `|| echo "NetBox warning (non-fatal)"`:
            #   1. No --env-file, so the compose file's
            #      `${NETBOX_SECRET_KEY:?...}` / `${NETBOX_SUPERUSER_PASSWORD:?...}`
            #      fail-fast aborted the whole command. NetBox never started.
            #   2. Wrong start order: `netbox` was started BEFORE its
            #      dependencies (netbox-postgres / netbox-redis). NetBox
            #      has `depends_on: condition: service_healthy` on both, so
            #      compose would refuse to start it anyway.
            # Correct order: databases/redis first, then the netbox app.
            NETBOX_COMPOSE=(docker compose
              -p "$COMPOSE_PROJECT"
              -f "$COMPOSE_FILE" -f "$NETBOX_COMPOSE_FILE"
              --env-file "$DEPLOY_DIR/secrets.env"
              --env-file "$DEPLOY_DIR/.env")

            if ! "${NETBOX_COMPOSE[@]}" up -d netbox-postgres netbox-redis; then
              echo "::error::NetBox datastore failed to start"
              "${NETBOX_COMPOSE[@]}" ps -a || true
              exit 1
            fi

            if ! "${NETBOX_COMPOSE[@]}" up -d --force-recreate netbox; then
              echo "::error::NetBox failed to start"
              "${NETBOX_COMPOSE[@]}" ps -a || true
              docker logs --tail 50 netbox-netbox 2>&1 || true
              exit 1
            fi
            echo "NetBox stack started"
          fi

      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          # Probe the published port (127.0.0.1:3000), not the container IP.
          # Host -> container-bridge traffic is dropped by the FORWARD/Tailscale
          # rules on the VPS, so 172.31.0.3 is unreachable from the runner host.
          # The published port is also the path real clients use.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:3000/api/health; then
              echo "Backend healthy (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::Backend not healthy in 120s -- diagnostics:"
          echo "=== containers ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          echo "=== backend state ==="
          docker inspect netconsole-backend --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}} Started={{.State.StartedAt}}' 2>&1 || true
          echo "=== backend logs (last 60) ==="
          docker logs --tail 60 netconsole-backend 2>&1 || true
          echo "=== listening on 3000/8443 ==="
          sudo -n ss -lntp 2>/dev/null | grep -E ':3000|:8443' || true
          exit 1

      - name: Verify frontend reachable
        run: |
          set -euo pipefail
          sleep 3
          code=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 5 https://127.0.0.1:8443/ || echo "000")
          if [ "$code" = "200" ]; then
            echo "Frontend OK (HTTPS $code)"
          else
            echo "Frontend HTTPS $code"; docker logs --tail 30 netconsole-frontend || true; exit 1
          fi

      - name: Verify kea + postgres untouched
        run: |
          docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" \
            --filter "name=netconsole-kea-primary" --filter "name=netconsole-kea-standby" \
            --filter "name=netconsole-postgres" \
            --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}"

      - name: Save deploy marker (for future auto-rollback)
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          printf '%s\n' "${{ github.sha }}" > "$DEPLOY_DIR/.last-deploy-sha"
          printf '%s\n' "${{ github.ref_name }}" > "$DEPLOY_DIR/.last-deploy-ref"
          printf '%s\n' "${{ github.event_name }}" > "$DEPLOY_DIR/.last-deploy-event"
          cp "$DEPLOY_DIR/.last-deploy-sha" "$DEPLOY_DIR/.rollback-before-deploy-sha"
          cp "$DEPLOY_DIR/.last-deploy-ref" "$DEPLOY_DIR/.rollback-before-deploy-ref"
          echo "Marker saved: $(cat "$DEPLOY_DIR/.last-deploy-sha")"

      - name: Open iptables port for NetBox (8080)
        run: |
          set +e
          # CHANGED 2026-10-22: NetBox is published on the LAN address
          # 192.168.81.171:8080 (NETBOX_BIND_IP), so the ACCEPT rule is
          # scoped to the office LAN. The previous unconditional
          # `-p tcp --dport 8080 -j ACCEPT` also opened the port on the
          # public-facing side.
          ADD_RULE() {
            iptables -C INPUT -p tcp -s 192.168.81.0/24 --dport 8080 -j ACCEPT -m comment --comment "netbox-sync" 2>/dev/null && return 0
            sudo -n iptables -I INPUT -p tcp -s 192.168.81.0/24 --dport 8080 -j ACCEPT -m comment --comment "netbox-sync" 2>&1 && return 0
            iptables -I INPUT -p tcp -s 192.168.81.0/24 --dport 8080 -j ACCEPT -m comment --comment "netbox-sync" 2>&1 && return 0
            echo "warning: iptables :8080 rule failed"
            return 1
          }
          ADD_RULE; set -e

      - name: Wait for NetBox healthy
        run: |
          set -euo pipefail
          # CHANGED 2026-10-22: NetBox is published on ${NETBOX_BIND_IP}
          # (192.168.81.171 on prod), NOT on 127.0.0.1. Probing
          # 127.0.0.1:8080 therefore always failed with a connection
          # refused and the step fell through to the 5-minute timeout.
          NETBOX_PROBE_URL="http://192.168.81.171:8080/api/dcim/sites/?limit=1"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 5 "$NETBOX_PROBE_URL"; then
              echo "NetBox healthy (attempt $i)"; exit 0
            fi
            sleep 5
          done
          echo "::warning::NetBox not healthy in 5 min"
          docker logs --tail 40 netbox-netbox 2>&1 || true

      - name: Final state
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "## Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose --env-file "$DEPLOY_DIR/secrets.env" --env-file "$DEPLOY_DIR/.env" \
            -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose --env-file "$DEPLOY_DIR/secrets.env" --env-file "$DEPLOY_DIR/.env" \
            -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" ps

  push-images:
    name: Push ${{ matrix.service }} to GHCR
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: worker
            context: worker
            dockerfile: worker/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
          # kea is built here instead of on the VPS: the production VPS has
          # no direct internet egress, and Docker does not forward the
          # client's proxy env into `docker build`, so a local kea build
          # on the runner cannot run `apt-get update` (see
          # docker-compose.app.prod.yml for the full explanation).
          - service: kea
            context: lab/kea
            dockerfile: lab/kea/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sonlak/netconsole-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            NETCONSOLE_VERSION=${{ github.ref_name }}
            NETCONSOLE_GIT_COMMIT=${{ github.sha }}

      - name: Summary
        if: ${{ matrix.service == 'backend' }}
        run: |
          echo "## Images pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/sonlak/netconsole-backend" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/sonlak/netconsole-worker" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/sonlak/netconsole-frontend" >> $GITHUB_STEP_SUMMARY

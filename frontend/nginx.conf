# SECURITY (H4, see docs/agents/16-security-audit-preprod.md):
#   HSTS — 2 years, include subdomains. Same headers backend emits via
#   helmet, defence-in-depth (some clients hit backend's /api/* path
#   directly without nginx in front during local dev). Nginx applies
#   these to every response it serves, including static assets.
#   CSP — strict by default; connect-src permits the OpenAI API for
#   future browser-side proxy. img-src allows data: URIs (AntD icons).
#   style-src 'unsafe-inline' is REQUIRED by AntD's runtime CSS-in-JS.
#   X-Frame-Options: DENY equivalent is frame-ancestors 'none' in CSP.

map $http_x_forwarded_proto $sts_proto {
    default "";
    https "https";
}

server {
    # SECURITY: TLS terminator on :443. The cert files live in
    # /etc/nginx/certs/ (copied by frontend/Dockerfile.prod).
    # For local dev (no cert), set LISTEN_HTTP_ONLY=1 via compose to
    # fall back to plain :80 — the Set-Cookie's `Secure` flag is
    # disabled in that path so cookies still flow on the HTTP
    # localhost.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect plain HTTP to HTTPS. We only listen on :80 if explicitly
    # asked (LISTEN_HTTP_ONLY=1 for local dev w/o certs).
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Block the clickjacking vector entirely. Modern browsers honour
    # CSP `frame-ancestors 'none'`; older ones fall back to X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.openai.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # WebSocket proxy for /ws/terminal
    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bumped from 120s → 600s so long-running tool calls
        # (e.g. `copy_netbox_prefixes` over 800 rows ≈ 75s) finish
        # without the upstream going idle. The backend SSE assistant
        # also emits `:keepalive` heartbeats every 25s during tool
        # execution so nginx sees fresh bytes and never triggers
        # this timeout in normal operation.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        gzip_proxied any;
        gzip_vary on;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

# Plain-HTTP listener — active only when LISTEN_HTTP_ONLY=1 is set in
# the container env (local dev / pre-Let's-Encrypt). Sends a 301 to
# the HTTPS listener so the cookie path converges as soon as the prod
# cert is in place.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HSTS ONLY on HTTPS. On HTTP we'd be telling the browser to
    # refuse to load the page over HTTP in future.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        return 301 https://$host$request_uri;
    }
}

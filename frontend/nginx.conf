# SECURITY (H4, see docs/agents/16-security-audit-preprod.md):
#   HSTS — 2 years, include subdomains. Same headers backend emits via
#   helmet, defence-in-depth (some clients hit backend's /api/* path
#   directly without nginx in front during local dev). Nginx applies
#   these to every response it serves, including static assets.
#   CSP — strict by default; connect-src permits the OpenAI API for
#   future browser-side proxy. img-src allows data: URIs (AntD icons).
#   style-src 'unsafe-inline' is REQUIRED by AntD's runtime CSS-in-JS.
#   X-Frame-Options: DENY equivalent is frame-ancestors 'none' in CSP.
#
# HTTPS-ONLY (2026-10-18): the previous fallback "server { listen 80;
# return 301 https://$host$request_uri; }" block is removed by design
# (per user request). For local dev, use HTTPS with a self-signed cert
# (browser will warn ONCE per session — click through, then the
# WebSocket `wss://` reuses the same cert trust). See
# frontend/certs/generate_self_signed.sh for the one-liner.
#
# Production deploy path (VPS):
#   1. `scripts/install_lets_encrypt.sh <domain>` (operator) — produces
#      /etc/letsencrypt/live/<domain>/fullchain.pem + privkey.pem
#   2. compose mounts /etc/letsencrypt/live/<domain>/ over
#      /etc/nginx/certs/ in the frontend service
#   3. container's self-signed cert (built into the image) is replaced
#      by the real one; no nginx config change needed.
#
# Local dev path (Windows + Docker):
#   1. Run `bash frontend/certs/generate_self_signed.sh` once — creates
#      frontend/certs/{cert,key}.pem (gitignored)
#   2. docker compose up frontend
#   3. Browse to https://localhost:8443 — accept cert warning ONCE
#   4. WebSocket `wss://localhost:8443/ws/terminal` works (same cert)

map $http_x_forwarded_proto $sts_proto {
    default "";
    https "https";
}

server {
    # TLS terminator on :443. Cert files live in /etc/nginx/certs/.
    # The image ships with a self-signed cert (generated at build
    # time by frontend/Dockerfile.prod) so the image boots out of the
    # box. Production replaces it via the docker volume mount in
    # docker-compose.app.yml.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Block the clickjacking vector entirely. Modern browsers honour
    # CSP `frame-ancestors 'none'`; older ones fall back to X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.openai.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # WebSocket proxy for /ws/terminal. Cookies (nc_refresh, Set-Cookie)
    # ride on the upgrade request just like a normal HTTPS request —
    # Secure-flagged cookies WILL flow because the connection is HTTPS.
    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bumped from 120s → 600s so long-running tool calls
        # (e.g. `copy_netbox_prefixes` over 800 rows ≈ 75s) finish
        # without the upstream going idle. The backend SSE assistant
        # also emits `:keepalive` heartbeats every 25s during tool
        # execution so nginx sees fresh bytes and never triggers
        # this timeout in normal operation.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        gzip_proxied any;
        gzip_vary on;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

# HTTPS-ONLY deployment — there is intentionally NO `server { listen
# 80; }` block. Plain HTTP traffic to port 80 will get connection
# refused. Browsers will auto-upgrade typed URLs (e.g. user types
# "http://.../...") to HTTPS via HSTS (after the first visit on
# HTTPS) or via their built-in http→https upgrade on .dev / .app /
# .bank TLDs. For non-HSTS hosts, operators must publish a 301
# redirect at the LB / DNS / CDN layer, not at nginx.
